<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemistria · แอดมินครูบุ๊ค</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.wrap{max-width:1180px} h4{margin:14px 0 6px} .inbox .item{flex-wrap:wrap}</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script>
const app = $("#app");
const S = { classes: [], cls: null, tab: "students", attDate: todayStr(), asg: null, item: null };
const TABS = [
  ["students", "👥 นักเรียน"], ["attend", "📋 เช็คชื่อ"], ["assign", "📝 งาน/การส่ง"], ["calendar", "📅 ปฏิทิน"],
  ["scores", "🧮 คะแนน"], ["quests", "🗺️ เควส"], ["gacha", "🎰 กาชา"], ["privs", "🎟️ สิทธิพิเศษ"],
  ["achv", "🏅 Achievement"], ["decor", "🎨 ตกแต่ง"], ["games", "🎮 มินิเกม"], ["teams", "🧪 ทีม"], ["boss", "👹 บอส"],
  ["digest", "📊 สรุปสัปดาห์"], ["export", "📤 ส่งออก Excel"], ["settings", "⚙️ ตั้งค่า"],
];
const clsName = () => S.classes.find((c) => c.id === S.cls)?.name || "";
const run = async (fn, ok) => { try { const r = await fn(); if (ok) toast(ok); return r; } catch (e) { toast(e.message); throw e; } };
const must = ({ data, error }) => { if (error) throw new Error(error.message); return data; };

/* ---------------- ล็อกอินครู ---------------- */
function showLogin(msg) {
  app.innerHTML = `<div class="login"><div class="card"><h2 class="center">🔐 แอดมินครูบุ๊ค</h2>
    ${msg ? `<p class="center" style="color:var(--red)">${esc(msg)}</p>` : ""}
    <div class="field"><label>อีเมล</label><input id="em" type="email" autocomplete="username"></div>
    <div class="field"><label>รหัสผ่าน</label><div style="position:relative"><input id="pw" type="password" autocomplete="current-password" style="padding-right:44px"><button type="button" id="eye" title="แสดง/ซ่อนรหัสผ่าน" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:18px">👁</button></div></div>
    <button class="btn gold" style="width:100%" id="go">เข้าสู่ระบบ</button></div></div>`;
  const go = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
    if (error) return toast("เข้าสู่ระบบไม่สำเร็จ: " + error.message);
    start();
  };
  $("#eye").onclick = () => { const p = $("#pw"); p.type = p.type === "password" ? "text" : "password"; p.focus(); };
  $("#go").onclick = go; $("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}

async function start() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return showLogin();
  let ok = false;
  try { ok = await rpc("is_teacher"); } catch (e) {}
  if (!ok) { await sb.auth.signOut(); return showLogin("บัญชีนี้ไม่ได้อยู่ในรายชื่อครู (ตาราง teachers)"); }
  S.classes = must(await sb.from("classes").select("*").order("name"));
  S.cls ||= S.classes[0]?.id;
  shell();
}

function shell() {
  app.innerHTML = `
    <div class="row" style="margin-bottom:10px">
      <h2 class="grow" style="margin:0">⚗️ Chemistria · แอดมินครูบุ๊ค</h2>
      <select id="clsSel" style="width:auto">${S.classes.map((c) => `<option value="${c.id}" ${c.id === S.cls ? "selected" : ""}>${esc(c.name)} · ${esc(c.subject_code || "")}</option>`).join("")}</select>
      <a class="btn ghost small" href="index.html" target="_blank">หน้านักเรียน</a>
      <button class="btn ghost small" id="out">ออกจากระบบ</button></div>
    <div class="tabs">${TABS.map(([k, l]) => `<button class="tab ${k === S.tab ? "on" : ""}" data-t="${k}">${l}</button>`).join("")}</div>
    <div id="view"></div>`;
  $("#clsSel").onchange = (e) => { S.cls = e.target.value; S.asg = S.item = null; renderTab(); };
  $("#out").onclick = async () => { await sb.auth.signOut(); showLogin(); };
  $$(".tab").forEach((b) => (b.onclick = () => { S.tab = b.dataset.t; $$(".tab").forEach((x) => x.classList.toggle("on", x === b)); renderTab(); }));
  renderTab();
}

async function renderTab() {
  const v = $("#view"); v.innerHTML = '<p class="muted">กำลังโหลด…</p>';
  v.onclick = v.onchange = null; // ล้างตัวจัดการของแท็บก่อนหน้า กันทำงานซ้อนกัน
  try { await TAB[S.tab](v); } catch (e) { v.innerHTML = `<div class="card" style="color:var(--red)">${esc(e.message)}</div>`; }
}

/* ---------------- ตัวช่วย CRUD แก้ไขได้ในตาราง ---------------- */
function cellInput(c, val, id) {
  const a = `data-id="${id}" data-k="${c.k}" data-t="${c.t || "text"}"`;
  if (c.t === "bool") return `<input type="checkbox" ${a} ${val ? "checked" : ""}>`;
  if (c.t === "select")
    return `<select ${a}>${c.opts().map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val ?? "") ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const type = c.t === "number" ? "number" : c.t === "date" ? "date" : "text";
  return `<input type="${type}" ${c.t === "number" ? 'step="any"' : ""} value="${esc(val ?? "")}" ${a} style="min-width:${c.w || 80}px">`;
}
const conv = (el) => {
  const t = el.dataset.t;
  if (t === "bool") return el.checked;
  if (t === "number") return el.value === "" ? null : Number(el.value);
  if (t === "date" || t === "select") return el.value === "" ? null : el.value;
  return el.value;
};

async function crud(host, { table, cols, filter = {}, defaults = {}, order, noDelete, addLabel = "เพิ่มรายการ" }) {
  let q = sb.from(table).select("*");
  for (const [k, v] of Object.entries(filter)) q = v === null ? q.is(k, null) : q.eq(k, v);
  if (order) q = q.order(order);
  const rows = must(await q);
  host.innerHTML = `<div class="scroll"><table><thead><tr>${cols.map((c) => `<th>${c.label}</th>`).join("")}<th></th></tr></thead>
    <tbody>${rows.map((r) => `<tr>${cols.map((c) => `<td>${cellInput(c, r[c.k], r.id)}</td>`).join("")}
      <td>${noDelete ? "" : `<button class="btn red small" data-del="${r.id}">ลบ</button>`}</td></tr>`).join("")}
    <tr style="background:#1b1238">${cols.map((c) => `<td>${cellInput(c, defaults[c.k] ?? (c.t === "bool" ? true : ""), "new")}</td>`).join("")}
      <td><button class="btn mint small" data-add="1">${addLabel}</button></td></tr></tbody></table></div>`;
  host.onchange = async (e) => {
    const el = e.target; if (!el.dataset.id || el.dataset.id === "new") return;
    await run(async () => must(await sb.from(table).update({ [el.dataset.k]: conv(el) }).eq("id", el.dataset.id)), "บันทึกแล้ว ✅");
  };
  host.onclick = async (e) => {
    const d = e.target.dataset;
    if (d.del) {
      if (!confirm("ลบรายการนี้? (ข้อมูลที่เกี่ยวข้องอาจถูกลบด้วย)")) return;
      await run(async () => must(await sb.from(table).delete().eq("id", d.del)), "ลบแล้ว");
      crud(host, arguments[1]);
    } else if (d.add) {
      const obj = { ...filter, ...defaults };
      $$('[data-id="new"]', host).forEach((el) => { const v = conv(el); if (v !== "" && v !== null) obj[el.dataset.k] = v; });
      await run(async () => must(await sb.from(table).insert(obj)), "เพิ่มแล้ว ✅");
      crud(host, arguments[1]);
    }
  };
}
const holder = (v, title, note = "") => {
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = `<h3>${title}</h3>${note ? `<p class="muted">${note}</p>` : ""}<div></div>`;
  v.appendChild(c); return c.lastElementChild;
};
const classOpts = (allLabel) => () => [["", allLabel], ...S.classes.map((c) => [c.id, c.name])];

/* ---------------- แต่ละแท็บ ---------------- */
const TAB = {
  async students(v) {
    const st = must(await sb.from("students").select("*").eq("class_id", S.cls).order("no"));
    v.innerHTML = `<div class="card"><h3>นักเรียน ${esc(clsName())} (${st.length} คน)</h3>
      <div class="scroll"><table><thead><tr><th>เลขที่</th><th>ชื่อ</th><th>อวาตาร์</th><th>Lv</th><th>EXP</th><th>เหรียญ</th><th></th></tr></thead><tbody>
      ${st.map((s) => `<tr><td>${s.no}</td><td><input value="${esc(s.name)}" data-id="${s.id}" data-k="name" style="min-width:160px"></td>
        <td>${esc(s.avatar)}</td><td>${Math.floor(Math.sqrt(s.exp / 40)) + 1}</td><td>${s.exp}</td><td>${s.coins}</td>
        <td><button class="btn small ghost" data-adj="${s.id}">± EXP/เหรียญ</button>
        <button class="btn small ghost" data-pin="${s.id}">รีเซ็ต PIN</button>
        <button class="btn small red" data-del="${s.id}">ลบ</button></td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><h3>เพิ่ม/อัปเดตรายชื่อ (วางจาก Excel ได้)</h3>
      <p class="muted">บรรทัดละคน รูปแบบ: <code>เลขที่ ชื่อ-นามสกุล</code> (คั่นด้วยแท็บ จุลภาค หรือเว้นวรรค) ถ้าเลขที่ซ้ำจะอัปเดตชื่อ</p>
      <textarea id="paste" rows="6" placeholder="1&#9;สมชาย ใจดี&#10;2&#9;สมหญิง รักเรียน"></textarea>
      <div class="row" style="margin-top:8px"><div style="width:140px"><label>PIN เริ่มต้น</label><input id="pin0" value="1234"></div>
      <button class="btn gold" id="addSt">เพิ่มรายชื่อ</button></div></div>`;
    v.onchange = async (e) => { const el = e.target; if (el.dataset.k === "name")
      await run(async () => must(await sb.from("students").update({ name: el.value }).eq("id", el.dataset.id)), "บันทึกแล้ว ✅"); };
    v.onclick = async (e) => {
      const d = e.target.dataset;
      if (d.adj) {
        const x = prompt("เพิ่ม/ลบ EXP (ใส่เลข เช่น 10 หรือ -5)", "0"); if (x === null) return;
        const c = prompt("เพิ่ม/ลบ เหรียญ", "0"); if (c === null) return;
        const r = prompt("เหตุผล", "ครูปรับให้"); if (r === null) return;
        await run(() => rpc("admin_adjust", { p_student: d.adj, p_exp: Number(x) || 0, p_coins: Number(c) || 0, p_reason: r }), "ปรับแล้ว ✅"); renderTab();
      } else if (d.pin) {
        const p = prompt("PIN ใหม่ (ตัวเลข)", "1234"); if (!p) return;
        await run(() => rpc("admin_reset_pin", { p_student: d.pin, p_pin: p }), "รีเซ็ต PIN แล้ว ✅");
      } else if (d.del) {
        if (confirm("ลบนักเรียนคนนี้และข้อมูลทั้งหมดของเขา?")) { await run(async () => must(await sb.from("students").delete().eq("id", d.del)), "ลบแล้ว"); renderTab(); }
      }
    };
    $("#addSt").onclick = async () => {
      const list = $("#paste").value.split("\n").map((l) => l.match(/^\s*(\d+)[\s,.\t]+(.+?)\s*$/)).filter(Boolean).map((m) => ({ no: Number(m[1]), name: m[2] }));
      if (!list.length) return toast("ไม่พบรายชื่อที่อ่านได้");
      const n = await run(() => rpc("admin_add_students", { p_class: S.cls, p_students: list, p_pin: $("#pin0").value || "1234" }), null);
      toast(`เพิ่ม/อัปเดต ${n} คนแล้ว ✅`); renderTab();
    };
  },

  async attend(v) {
    const [st, at] = await Promise.all([
      sb.from("students").select("id,no,name").eq("class_id", S.cls).order("no").then(must),
      sb.from("ch_attendance").select("student_id,status").eq("class_id", S.cls).eq("att_date", S.attDate).then(must),
    ]);
    const cur = Object.fromEntries(at.map((a) => [a.student_id, a.status]));
    const opts = [["present", "มา"], ["late", "สาย"], ["leave", "ลา"], ["absent", "ขาด"]];
    v.innerHTML = `<div class="card"><div class="row"><h3 class="grow" style="margin:0">เช็คชื่อ ${esc(clsName())}</h3>
      <input type="date" id="ad" value="${S.attDate}" style="width:auto">
      <button class="btn ghost small" id="allp">ทุกคนมา</button><button class="btn gold" id="saveA">บันทึก</button></div>
      <p class="muted">มา = +5 EXP/+2 เหรียญ · สาย = +2 EXP/+1 เหรียญ (ให้อัตโนมัติ ไม่ซ้ำแม้บันทึกหลายรอบ) · แถวที่ไม่เลือกจะไม่ถูกบันทึก</p>
      <div class="scroll"><table><tbody>${st.map((s) => `<tr><td>${s.no}</td><td>${esc(s.name)}</td><td class="seg">
      ${opts.map(([k, l]) => `<label><input type="radio" name="a_${s.id}" value="${k}" ${cur[s.id] === k ? "checked" : ""}>${l}</label>`).join("")}</td></tr>`).join("")}</tbody></table></div></div>`;
    $("#ad").onchange = (e) => { S.attDate = e.target.value || todayStr(); renderTab(); };
    $("#allp").onclick = () => $$('input[value="present"]').forEach((r) => (r.checked = true));
    $("#saveA").onclick = async () => {
      const recs = st.map((s) => ({ student_id: s.id, status: $(`input[name="a_${s.id}"]:checked`)?.value })).filter((r) => r.status);
      if (!recs.length) return toast("ยังไม่ได้เลือกสถานะ");
      const n = await run(() => rpc("admin_mark_attendance", { p_class: S.cls, p_date: S.attDate, p_records: recs }), null);
      toast(`บันทึกเช็คชื่อ ${n} คนแล้ว ✅`);
    };
  },

  async assign(v) {
    const h = holder(v, "📝 งานที่มอบหมาย", "วิธีส่ง: “นักเรียนกดส่ง/ส่งรูป” = นักเรียนส่งเองจากหน้าเว็บและได้ EXP ทันที (ครูส่งคืนได้ถ้ารูปไม่ผ่าน) · เลือกงานด้านล่างเพื่อบันทึกการส่ง · EXP/เหรียญจะให้อัตโนมัติเมื่อบันทึกสถานะ “ส่งแล้ว” (ส่งช้าได้ครึ่งหนึ่ง)");
    await crud(h, { table: "ch_assignments", filter: { class_id: S.cls }, order: "due_date", defaults: { max_score: 10, exp_reward: 20, coin_reward: 5 },
      cols: [{ k: "title", label: "ชื่องาน", w: 180 }, { k: "due_date", label: "กำหนดส่ง", t: "date" }, { k: "max_score", label: "เต็ม", t: "number", w: 60 },
        { k: "exp_reward", label: "EXP", t: "number", w: 60 }, { k: "coin_reward", label: "เหรียญ", t: "number", w: 60 },
        { k: "submit_mode", label: "วิธีส่ง", t: "select", opts: () => [["teacher", "ครูบันทึกเอง"], ["online", "นักเรียนกดส่งออนไลน์"], ["photo", "นักเรียนส่งรูป"]] }, { k: "description", label: "รายละเอียด", w: 160 }] });
    const as = must(await sb.from("ch_assignments").select("id,title").eq("class_id", S.cls).order("due_date"));
    if (!as.length) return;
    S.asg = as.find((a) => a.id === S.asg) ? S.asg : as[0].id;
    const [st, sub] = await Promise.all([
      sb.from("students").select("id,no,name").eq("class_id", S.cls).order("no").then(must),
      sb.from("ch_submissions").select("id,student_id,status,score,image_path,via,note").eq("assignment_id", S.asg).then(must),
    ]);
    const cur = Object.fromEntries(sub.map((s) => [s.student_id, s]));
    const g = holder(v, "✅ บันทึกการส่งงาน");
    g.innerHTML = `<div class="row"><select id="asel" style="width:auto">${as.map((a) => `<option value="${a.id}" ${a.id === S.asg ? "selected" : ""}>${esc(a.title)}</option>`).join("")}</select>
      <button class="btn ghost small" id="allS">ทุกคนส่งแล้ว</button><button class="btn gold" id="saveS">บันทึก</button></div>
      <div class="scroll"><table><thead><tr><th>#</th><th>ชื่อ</th><th>สถานะ</th><th>คะแนน</th><th>ส่งเอง/รูป</th></tr></thead><tbody>
      ${st.map((s) => `<tr><td>${s.no}</td><td>${esc(s.name)}</td><td class="seg">
        ${[["submitted", "ส่ง"], ["late", "ช้า"], ["missing", "ไม่ส่ง"]].map(([k, l]) => `<label><input type="radio" name="s_${s.id}" value="${k}" ${cur[s.id]?.status === k ? "checked" : ""}>${l}</label>`).join("")}</td>
        <td><input type="number" step="any" id="sc_${s.id}" value="${cur[s.id]?.score ?? ""}" style="width:80px"></td>
        <td>${cur[s.id]?.via === "student" ? '<span class="tag ok">ส่งเอง</span> ' : ""}${cur[s.id]?.image_path ? `<button class="btn small ghost" data-img="${esc(cur[s.id].image_path)}">🖼️ ดูรูป</button> ` : ""}${cur[s.id]?.via === "student" && ["submitted", "late"].includes(cur[s.id]?.status) ? `<button class="btn small red" data-ret="${cur[s.id].id}">↩️ ส่งคืน</button>` : ""}${cur[s.id]?.note ? `<div class="muted">${esc(cur[s.id].note)}</div>` : ""}</td></tr>`).join("")}</tbody></table></div>`;
    g.onclick = async (e) => {
      const d = e.target.dataset;
      if (d.img) {
        const { data, error } = await sb.storage.from("submissions").createSignedUrl(d.img, 3600);
        if (error) return toast("เปิดรูปไม่ได้: " + error.message);
        const o = document.createElement("div"); o.className = "overlay on"; o.style.cursor = "zoom-out";
        o.innerHTML = `<img src="${data.signedUrl}" style="max-width:96vw;max-height:92vh;border-radius:12px">`; o.onclick = () => o.remove(); document.body.appendChild(o);
      } else if (d.ret) {
        const note = prompt("เหตุผลที่ส่งคืน (นักเรียนจะเห็น และส่งใหม่ได้ · ระบบหัก EXP/เหรียญที่ให้ไปคืน)", "รูปไม่ชัด / งานไม่ครบ"); if (note === null) return;
        await run(() => rpc("admin_return_submission", { p_sub: d.ret, p_note: note }), "ส่งคืนแล้ว ↩️"); renderTab();
      }
    };
    $("#asel").onchange = (e) => { S.asg = e.target.value; renderTab(); };
    $("#allS").onclick = () => $$('input[value="submitted"]', g).forEach((r) => (r.checked = true));
    $("#saveS").onclick = async () => {
      const recs = st.map((s) => ({ student_id: s.id, status: $(`input[name="s_${s.id}"]:checked`)?.value, score: $("#sc_" + s.id).value })).filter((r) => r.status);
      if (!recs.length) return toast("ยังไม่ได้เลือกสถานะ");
      const n = await run(() => rpc("admin_mark_submissions", { p_assignment: S.asg, p_records: recs }), null);
      toast(`บันทึกการส่งงาน ${n} คนแล้ว ✅`);
    };
  },

  async calendar(v) {
    const h = holder(v, "📅 ปฏิทินรายวิชา", "เว้นห้องว่างไว้ = แสดงให้ทุกห้อง · วันกำหนดส่งงานจะขึ้นในปฏิทินนักเรียนอัตโนมัติ");
    await crud(h, { table: "events", order: "event_date", defaults: { kind: "lesson", event_date: todayStr(), class_id: S.cls },
      cols: [{ k: "event_date", label: "วันที่", t: "date" }, { k: "end_date", label: "ถึงวันที่", t: "date" }, { k: "title", label: "หัวข้อ", w: 200 },
        { k: "kind", label: "ประเภท", t: "select", opts: () => Object.entries(KIND_LABEL) }, { k: "class_id", label: "ห้อง", t: "select", opts: classOpts("ทุกห้อง") }, { k: "note", label: "หมายเหตุ", w: 160 }] });
  },

  async scores(v) {

    const pill = (t, cls = "") => `<span class="pill ${cls}" style="margin:2px">${t}</span>`;
    const lines = [];
    lines.push(`สรุปห้อง ${clsName()} (${fmtDate(r.from)} – ${fmtDate(r.to)})`, `มาเรียน ${rate}% (มา ${A.present} สาย ${A.late} ขาด ${A.absent} ลา ${A.leave}) · EXP รวมที่นักเรียนได้ ${r.exp_total}`);
    const abs = r.absent.map((x) => `${x.no}. ${x.name} — ขาด ${x.absent_week} ครั้งในช่วงนี้ (30 วัน: ขาด ${x.absent_30} สาย ${x.late_30})`);
    const mis = r.missing.map((x) => `${x.no}. ${x.name} — ค้างส่ง ${x.missing} ชิ้น: ${x.titles.join(", ")}`);
    const ina = r.inactive.map((x) => `${x.no}. ${x.name} — ${x.last_login ? "เข้าล่าสุด " + fmtDate(x.last_login) : "ยังไม่เคยเข้า"}`);
    lines.push("", "ขาดเรียน:", ...(abs.length ? abs : ["— ไม่มี"]), "", "ค้างส่งงาน:", ...(mis.length ? mis : ["— ไม่มี"]), "", "ไม่ได้เข้าเว็บ:", ...(ina.length ? ina : ["— ไม่มี"]));
    $("#dBody").innerHTML = `<div class="grid">
        <div class="card stat"><span class="muted">มาเรียน</span><b>${rate}%</b>จาก ${tot} รายการ</div>
        <div class="card stat"><span class="muted">ขาด / สาย</span><b>${A.absent} / ${A.late}</b>ครั้ง</div>
        <div class="card stat"><span class="muted">EXP ที่นักเรียนได้</span><b>${r.exp_total}</b>รวมทั้งห้อง</div></div>
      ${sec("🚫 ขาดเรียน (ช่วงนี้ หรือสะสม ≥ 3 ครั้งใน 30 วัน)", r.absent.map((x) => `<div class="item"><div class="grow"><b>${x.no}. ${esc(x.name)}</b></div>${pill("ขาดช่วงนี้ " + x.absent_week, x.absent_week >= 2 ? "rar-SR" : "")}${pill("30 วัน: ขาด " + x.absent_30 + " สาย " + x.late_30)}</div>`), "ไม่มีนักเรียนขาด 🎉")}
      ${sec("📝 ค้างส่งงาน (เลยกำหนดและยังไม่ส่ง)", r.missing.map((x) => `<div class="item"><div class="grow"><b>${x.no}. ${esc(x.name)}</b><div class="muted">${x.titles.map(esc).join(" · ")}</div></div>${pill("ค้าง " + x.missing + " ชิ้น", x.missing >= 2 ? "rar-SR" : "")}</div>`), "ไม่มีงานค้าง 🎉")}
      ${sec("💤 ไม่ได้เข้าเว็บในช่วงนี้", r.inactive.map((x) => `<div class="item"><div class="grow"><b>${x.no}. ${esc(x.name)}</b></div><span class="muted">${x.last_login ? "เข้าล่าสุด " + fmtDate(x.last_login) : "ยังไม่เคยเข้า"}</span></div>`), "ทุกคนเข้าเว็บแล้ว 🎉")}
      ${sec("🏅 EXP สูงสุดช่วงนี้", r.top.map((x, i) => `<div class="item"><b style="width:28px">${i + 1}</b><div class="grow">${x.no}. ${esc(x.name)}</div><b>+${x.exp_week}</b></div>`), "ยังไม่มีข้อมูล")}`;
    $("#dDays").onchange = (e) => { S.digDays = e.target.value; renderTab(); };
    $("#dCopy").onclick = async () => { await navigator.clipboard.writeText(lines.join("\n")); toast("คัดลอกสรุปแล้ว ✅ นำไปวางใน LINE ได้"); };
  },

  async export(v) {
    v.innerHTML = `<div class="card"><h3>📤 ส่งออกเป็น Excel (.xlsx)</h3>
      <p class="muted">ไฟล์ของห้อง <b>${esc(clsName())}</b> มี 5 ชีต: สมุดคะแนนรวม · รายการคะแนน · เช็คชื่อ · งาน · EXP/เหรียญ — ใช้ตัดเกรดหรือส่งฝ่ายวิชาการได้ทันที</p>
      <div class="row"><button class="btn gold" id="xCls">⬇️ ดาวน์โหลดห้อง ${esc(clsName())}</button>
      <button class="btn ghost" id="xAll">⬇️ คะแนนรวมทุกห้อง (1 ชีตต่อห้อง)</button></div></div>`;
    const need = () => { if (!window.XLSX) { toast("โหลดตัวสร้าง Excel ไม่สำเร็จ (ตรวจอินเทอร์เน็ต)"); return false; } return true; };
    const save = (wb, name) => XLSX.writeFile(wb, name + "_" + todayStr() + ".xlsx");
    const sheet = (rows, widths) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = (widths || rows[0].map((_, i) => (i === 1 ? 26 : 12))).map((w) => ({ wch: w })); return ws; };
    const gbRows = (gb) => [["เลขที่", "ชื่อ", "ก่อนกลางภาค", "กลางภาค", "หลังกลางภาค", "ปลายภาค", "จิตพิสัย", "คะแนนพิเศษ", "รวม (ไม่รวมพิเศษ)", "รวมพิเศษ"],
      ...gb.map((r) => [r.no, r.name, r.pre_mid, r.midterm, r.post_mid, r.final, r.behavior, r.bonus, r.total, r.total_with_bonus])];
    $("#xCls").onclick = async () => {
      if (!need()) return;
      const [st, gb, items, sc, att, asg, sub] = await Promise.all([
        sb.from("students").select("id,no,name,exp,coins").eq("class_id", S.cls).order("no").then(must),
        sb.from("v_gradebook").select("*").eq("class_id", S.cls).order("no").then(must),
        sb.from("score_items").select("*").eq("class_id", S.cls).order("created_at").then(must),
        sb.from("scores").select("item_id,student_id,score").then(must),
        sb.from("ch_attendance").select("student_id,att_date,status").eq("class_id", S.cls).order("att_date").then(must),
        sb.from("ch_assignments").select("id,title,due_date,max_score").eq("class_id", S.cls).order("due_date").then(must),
        sb.from("ch_submissions").select("assignment_id,student_id,status,score").then(must),
      ]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, sheet(gbRows(gb)), "สมุดคะแนนรวม");
      const scm = {}; sc.forEach((x) => (scm[x.item_id + x.student_id] = x.score));
      XLSX.utils.book_append_sheet(wb, sheet([["เลขที่", "ชื่อ", ...items.map((i) => `${CAT_LABEL[i.category]}: ${i.title} (เต็ม ${i.max_score})`)],
        ...st.map((s) => [s.no, s.name, ...items.map((i) => scm[i.id + s.id] ?? "")])], [8, 26, ...items.map(() => 18)]), "รายการคะแนน");
      const dates = [...new Set(att.map((a) => a.att_date))].sort(), am = {}; att.forEach((a) => (am[a.student_id + a.att_date] = a.status));
      const L = { present: "ม", late: "ส", absent: "ข", leave: "ล" };
      XLSX.utils.book_append_sheet(wb, sheet([["เลขที่", "ชื่อ", ...dates.map(fmtDate), "มา", "สาย", "ขาด", "ลา"],
        ...st.map((s) => { const row = dates.map((d) => am[s.id + d]); const n = (k) => row.filter((x) => x === k).length;
          return [s.no, s.name, ...row.map((x) => L[x] || ""), n("present"), n("late"), n("absent"), n("leave")]; })], [8, 26, ...dates.map(() => 9), 6, 6, 6, 6]), "เช็คชื่อ");
      const smm = {}; sub.forEach((x) => (smm[x.assignment_id + x.student_id] = x));
      const SL = { submitted: "ส่ง", late: "ส่งช้า", missing: "ไม่ส่ง" };
      XLSX.utils.book_append_sheet(wb, sheet([["เลขที่", "ชื่อ", ...asg.map((a) => `${a.title}${a.due_date ? " (ส่ง " + fmtDate(a.due_date) + ")" : ""}`)],
        ...st.map((s) => [s.no, s.name, ...asg.map((a) => { const x = smm[a.id + s.id]; return x ? SL[x.status] + (x.score != null ? ` (${x.score}/${a.max_score})` : "") : ""; })])], [8, 26, ...asg.map(() => 20)]), "งาน");
      XLSX.utils.book_append_sheet(wb, sheet([["เลขที่", "ชื่อ", "เลเวล", "EXP", "เหรียญ"], ...st.map((s) => [s.no, s.name, Math.floor(Math.sqrt(s.exp / 40)) + 1, s.exp, s.coins])], [8, 26, 8, 10, 10]), "EXP-เหรียญ");
      save(wb, "Chemistria_" + clsName().replace(/[\\/:*?\[\]]/g, "-")); toast("ดาวน์โหลดแล้ว ✅");
    };
    $("#xAll").onclick = async () => {
      if (!need()) return;
      const wb = XLSX.utils.book_new();
      for (const c of S.classes) {
        const gb = must(await sb.from("v_gradebook").select("*").eq("class_id", c.id).order("no"));
        XLSX.utils.book_append_sheet(wb, sheet(gbRows(gb)), c.name.replace(/[\\/:*?\[\]]/g, "-").slice(0, 30));
      }
      save(wb, "Chemistria_คะแนนทุกห้อง"); toast("ดาวน์โหลดแล้ว ✅");
    };
  },

  async games(v) {
    const set = Object.fromEntries(must(await sb.from("app_settings").select("*")).map((x) => [x.key, x.value]));
    const f = [["game_daily_cap_exp", "เพดาน EXP จากมินิเกมต่อวัน", 40], ["quiz_count", "จำนวนข้อควิซประจำวัน", 5], ["quiz_exp_per_correct", "EXP ต่อข้อที่ตอบถูก", 4],
      ["quiz_perfect_bonus", "โบนัส EXP เมื่อถูกทุกข้อ", 5], ["match_max_exp", "EXP สูงสุดต่อรอบเกมจับคู่ธาตุ", 10], ["match_plays_per_day", "จำนวนรอบจับคู่ที่ได้รางวัลต่อวัน", 3]];
    const day = todayStr();
    const plays = must(await sb.from("game_plays").select("game,student_id,exp,students(class_id)").eq("play_date", day));
    const mine = plays.filter((p) => p.students?.class_id === S.cls);
    const q = new Set(mine.filter((p) => p.game === "quiz").map((p) => p.student_id)).size;
    const m = new Set(mine.filter((p) => p.game === "match").map((p) => p.student_id)).size;
    v.innerHTML = `<div class="card"><h3>🎮 ตั้งค่ามินิเกม</h3>
      <p class="muted">วันนี้ห้อง ${esc(clsName())}: ทำควิซแล้ว <b>${q}</b> คน · เล่นจับคู่ธาตุแล้ว <b>${m}</b> คน (ระบบตรวจคำตอบและจำกัด EXP ที่เซิร์ฟเวอร์)</p>
      <div class="row">${f.map(([k, l, d]) => `<div style="width:230px"><label>${l}</label><input type="number" data-set="${k}" value="${esc(set[k] ?? d)}"></div>`).join("")}</div></div>`;
    v.onchange = async (e) => { const k = e.target.dataset.set; if (!k) return;
      await run(async () => must(await sb.from("app_settings").upsert({ key: k, value: String(e.target.value) })), "บันทึกแล้ว ✅"); };
    const cl = must(await sb.from("classes").select("id,quiz_topic").eq("id", S.cls))[0];
    const allQ = must(await sb.from("quiz_questions").select("topic"));
    const topics = [...new Set(allQ.map((q) => q.topic))];
    const tp = holder(v, "📚 ควิซตามบทเรียน", `ตั้ง “บทที่กำลังเรียน” ของห้อง ${esc(clsName())} → ควิซประจำวันจะดึงข้อของบทนี้ก่อน (ถ้าข้อไม่พอจะเติมจากข้อทั่วไป) · ว่าง = สุ่มจากทุกหัวข้อ`);
    tp.innerHTML = `<div class="row"><div style="width:260px"><label>บทที่กำลังเรียน (หัวข้อ)</label><input id="qtopic" list="tplist" value="${esc(cl?.quiz_topic || "")}" placeholder="เช่น โมล"><datalist id="tplist">${topics.map((t) => `<option value="${esc(t)}">`).join("")}</datalist></div>
      <button class="btn gold" id="saveTopic">บันทึก</button></div>
      <h4>เพิ่มคำถามหลายข้อพร้อมกัน (วางจาก Excel/ข้อความได้)</h4>
      <p class="muted">บรรทัดละข้อ คั่นด้วย | หรือแท็บ: <code>คำถาม | ก | ข | ค | ง | ข้อที่ถูก (ก/ข/ค/ง หรือ 1-4) | คำอธิบายเฉลย(ไม่บังคับ)</code></p>
      <div class="row"><div style="width:200px"><label>หัวข้อ/บท</label><input id="bTopic" list="tplist" placeholder="เช่น โมล"></div>
        <div style="width:200px"><label>ใช้กับห้อง</label><select id="bClass">${classOpts("ทุกห้อง")().map(([v2, l]) => `<option value="${esc(v2)}" ${v2 === S.cls ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div></div>
      <textarea id="bulkQ" rows="6" placeholder="1 โมลของ H2O หนักกี่กรัม | 16 | 18 | 20 | 32 | ข | มวลโมเลกุลของน้ำ = 18"></textarea>
      <button class="btn mint" id="addBulk" style="margin-top:8px">เพิ่มคำถาม</button>`;
    $("#saveTopic").onclick = () => run(async () => must(await sb.from("classes").update({ quiz_topic: $("#qtopic").value.trim() || null }).eq("id", S.cls)), "บันทึกบทที่กำลังเรียนแล้ว ✅");
    $("#addBulk").onclick = async () => {
      const topic = $("#bTopic").value.trim() || "ทั่วไป", cls = $("#bClass").value || null, rows = [];
      for (const line of $("#bulkQ").value.split("\n")) {
        const c = line.split(/\t|\|/).map((x) => x.trim()); if (c.length < 6) continue;
        const ans = "กขคง".indexOf(c[5][0]) >= 0 ? "กขคง".indexOf(c[5][0]) : Number(c[5]) - 1;
        if (!(ans >= 0 && ans <= 3)) continue;
        rows.push({ topic, class_id: cls, question: c[0].replace(/^\d+[.)]\s*/, ""), a: c[1], b: c[2], c: c[3], d: c[4], answer: ans, explain: c[6] || null, active: true });
      }
      if (!rows.length) return toast("ไม่พบบรรทัดที่อ่านได้ (ต้องมีอย่างน้อย 6 ช่อง)");
      await run(async () => must(await sb.from("quiz_questions").insert(rows)), `เพิ่มคำถาม ${rows.length} ข้อแล้ว ✅`); renderTab();
    };
    const h = holder(v, "🧠 คลังคำถามควิซ", "นักเรียนแต่ละคนได้ชุดคำถามสุ่มต่างกันในแต่ละวัน · เฉลยตรวจที่เซิร์ฟเวอร์ ไม่ถูกส่งไปที่เครื่องนักเรียนก่อนส่งคำตอบ · ปิดข้อที่ไม่ต้องการได้ด้วยช่อง “เปิด”");
    await crud(h, { table: "quiz_questions", order: "topic", defaults: { topic: "ทั่วไป", answer: 0, active: true },
      cols: [{ k: "topic", label: "หัวข้อ/บท", w: 90 }, { k: "class_id", label: "ห้อง", t: "select", opts: classOpts("ทุกห้อง") }, { k: "question", label: "คำถาม", w: 260 }, { k: "a", label: "ก.", w: 110 }, { k: "b", label: "ข.", w: 110 }, { k: "c", label: "ค.", w: 110 }, { k: "d", label: "ง.", w: 110 },
        { k: "answer", label: "ข้อที่ถูก", t: "select", opts: () => [["0", "ก"], ["1", "ข"], ["2", "ค"], ["3", "ง"]] }, { k: "explain", label: "คำอธิบายเฉลย", w: 220 }, { k: "active", label: "เปิด", t: "bool" }] });
  },

  async settings(v) {
    const set = Object.fromEntries(must(await sb.from("app_settings").select("*")).map((s) => [s.key, s.value]));
    const f = [["gacha_cost", "ราคากาชาต่อครั้ง (เหรียญ)"], ["pity_max", "การันตี SR+ ทุกกี่ครั้ง"], ["daily_quest_count", "จำนวนเควสประจำวันที่สุ่มให้"], ["class_change_cost", "ราคาเปลี่ยนคลาส (เหรียญ) — เลือกครั้งแรกฟรี"]];
    v.innerHTML = `<div class="card"><h3>⚙️ ตั้งค่าระบบ</h3><div class="row">${f.map(([k, l]) => `<div style="width:220px"><label>${l}</label><input type="number" data-set="${k}" value="${esc(set[k] ?? "")}"></div>`).join("")}
      <div style="width:220px"><label>ให้นักเรียนเห็นคะแนนตัวเอง</label><select data-set="show_scores"><option value="1" ${set.show_scores !== "0" ? "selected" : ""}>แสดง</option><option value="0" ${set.show_scores === "0" ? "selected" : ""}>ซ่อน</option></select></div></div></div>`;
    v.onchange = async (e) => { const k = e.target.dataset.set; if (!k) return;
      await run(async () => must(await sb.from("app_settings").upsert({ key: k, value: String(e.target.value) })), "บันทึกแล้ว ✅"); };
    const h = holder(v, "🏫 ห้องเรียน", "รหัสห้องใช้ตอนนักเรียนล็อกอิน (เช่น M6-2) · เพดานคะแนนพิเศษคือคะแนนพิเศษสูงสุดที่รวมได้");
    await crud(h, { table: "classes", order: "name", noDelete: false, defaults: { bonus_cap: 5, term: "2569/2" },
      cols: [{ k: "code", label: "รหัสห้อง", w: 80 }, { k: "name", label: "ชื่อห้อง", w: 80 }, { k: "subject_code", label: "รหัสวิชา", w: 80 }, { k: "subject_name", label: "ชื่อวิชา", w: 160 },
        { k: "term", label: "ภาคเรียน", w: 80 }, { k: "bonus_cap", label: "เพดานคะแนนพิเศษ", t: "number", w: 80 }] });
    const hr = holder(v, "🎖️ แรงค์ (สไตล์ LoL)", "แต่ละแรงค์เริ่มที่ EXP ขั้นต่ำที่ตั้งไว้ · จำนวนดิวิชัน 4 = IV→I, 1 = ไม่มีดิวิชัน (เช่น Master) · แรงค์สุดท้ายคือสูงสุด");
    await crud(hr, { table: "ch_ranks", order: "sort", defaults: { divisions: 4, sort: 99, min_exp: 0 },
      cols: [{ k: "sort", label: "ลำดับ", t: "number", w: 60 }, { k: "key", label: "รหัส", w: 100 }, { k: "name", label: "ชื่อแรงค์", w: 120 },
        { k: "min_exp", label: "EXP เริ่ม", t: "number", w: 80 }, { k: "divisions", label: "ดิวิชัน", t: "number", w: 70 }, { k: "image", label: "รูป (assets/ranks/…png)", w: 200 }] });
    const hc = holder(v, "⚔️ คลาสตัวละคร", "ผลความสามารถ 4 คลาสผูกกับ “รหัส” (alchemist, scientist, guardian, seeker) — แก้ชื่อ/คำอธิบาย/รูปได้ แต่ไม่ควรเปลี่ยนรหัส");
    await crud(hc, { table: "char_classes", order: "sort", defaults: { sort: 99, active: true },
      cols: [{ k: "sort", label: "ลำดับ", t: "number", w: 60 }, { k: "key", label: "รหัส", w: 90 }, { k: "emoji", label: "อีโมจิ", w: 50 }, { k: "name", label: "ชื่อคลาส", w: 130 },
        { k: "description", label: "คำโปรย", w: 160 }, { k: "ability", label: "ความสามารถ (ข้อความอธิบาย)", w: 240 }, { k: "image", label: "รูป", w: 180 }, { k: "active", label: "เปิด", t: "bool" }] });
    const note = document.createElement("p"); note.className = "muted"; note.textContent = "หลังเพิ่ม/ลบห้อง ให้โหลดหน้าใหม่เพื่ออัปเดตรายการห้องด้านบน"; v.appendChild(note);
  },
};

sb.auth.onAuthStateChange(() => {});
start();
</script>
</body>
</html>
