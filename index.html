<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemistria · ห้องเรียนครูบุ๊ค</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="wrap"></div>
<div id="overlay" class="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="lib.js"></script>
<script src="games.js"></script>
<script>
const TABS = [
  ["home", "🏠 หน้าหลัก"], ["att", "📋 เช็คชื่อ/งาน"], ["cal", "📅 ปฏิทิน"], ["score", "🧮 คะแนน"],
  ["class", "⚔️ คลาส"], ["decor", "🎨 ตกแต่ง"], ["game", "🎮 เกม"], ["quest", "🗺️ เควส"], ["gacha", "🎰 กาชา"], ["bag", "🎒 คลัง"], ["shop", "🛒 ร้านค้า"], ["rank", "🏆 อันดับ"], ["board", "📢 บอร์ด"],
];
let D = null, X = {}, B = { posts: [], unread: 0 }, NAVOPEN = false, HOF = [], DRAFT = null, decSlot = "outfit", tab = "home", calMonth = new Date(), calSel = todayStr();
const TOKEN_KEY = "kb_token";
const app = $("#app");

/* ---------------- ล็อกอิน ---------------- */
async function showLogin(msg) {
  let classes = [];
  try { classes = (await rpc("list_classes")) || []; } catch (e) { msg = msg || e.message; }
  app.innerHTML = `
  <div class="login2">
    <div class="lg-orbs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="lg-sym"><span style="--i:0">H</span><span style="--i:1">C</span><span style="--i:2">O</span><span style="--i:3">N</span><span style="--i:4">Na</span><span style="--i:5">Fe</span></div>
    <div class="lg-cast">
      <img src="assets/avatars/alchemist.png" alt="" onerror="this.remove()"><img src="assets/avatars/scientist.png" alt="" onerror="this.remove()">
      <img src="assets/avatars/guardian.png" alt="" onerror="this.remove()"><img src="assets/avatars/seeker.png" alt="" onerror="this.remove()">
    </div>
    <div class="lg-card">
      <div class="lg-logo">⚗️</div>
      <h1 class="lg-title">Chemistria</h1>
      <p class="lg-sub">ห้องเรียนเคมีผจญภัย · ครูบุ๊ค</p>
      ${msg ? `<p class="center" style="color:var(--red);margin:0 0 8px">${esc(msg)}</p>` : ""}
      <div class="lg-f"><span>🏫</span><select id="lc">${classes.map((c) => `<option value="${esc(c.code)}">${esc(c.name)} · ${esc(c.subject || "")}</option>`).join("")}</select></div>
      <div class="lg-f"><span>🎫</span><input id="ln" type="number" inputmode="numeric" min="1" placeholder="เลขที่"></div>
      <div class="lg-f"><span>🔑</span><input id="lp" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN (ตัวเลข)"></div>
      <button class="btn gold lg-btn" id="lbtn">✨ เข้าสู่ห้องแล็บ</button>
      <p class="muted center" style="margin:12px 0 0;font-size:.8em">ครั้งแรกใช้ PIN ที่ครูแจก แล้วเปลี่ยนเองได้ในหน้า “หน้าหลัก”</p>
    </div>
  </div>`;
  const go = async () => {
    const btn = $("#lbtn"); btn.disabled = true;
    try {
      const r = await rpc("student_login", { p_class_code: $("#lc").value, p_no: Number($("#ln").value), p_pin: $("#lp").value });
      if (r.error) throw new Error(r.error);
      localStorage.setItem(TOKEN_KEY, r.token);
      await load();
    } catch (e) { toast(e.message); btn.disabled = false; }
  };
  $("#lbtn").onclick = go;
  $("#lp").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}

function logout() { localStorage.removeItem(TOKEN_KEY); D = null; showLogin(); }
async function changePin() {
  const o = prompt("PIN เดิม"); if (o === null) return;
  const n = prompt("PIN ใหม่ (ตัวเลข 4-6 หลัก)"); if (n === null) return;
  try { await rpc("change_pin", { p_token: tk(), p_old: o, p_new: n }); toast("เปลี่ยน PIN แล้ว ✅"); }
  catch (e) { toast(e.message); }
}
const tk = () => localStorage.getItem(TOKEN_KEY);

async function load() {
  if (!tk()) return showLogin();
  try {
    D = await rpc("student_dashboard", { p_token: tk() });
    try { HOF = (await rpc("hall_of_fame", { p_token: tk() })) || []; } catch (e) { HOF = []; }
    try { X = (await rpc("student_extras", { p_token: tk() })) || {}; } catch (e) { X = {}; }
    DRAFT = null;
    try { B = (await rpc("board_list", { p_token: tk() })) || { posts: [], unread: 0 }; } catch (e) { B = { posts: [], unread: 0 }; }
    render();
  } catch (e) {
    localStorage.removeItem(TOKEN_KEY);
    showLogin(e.message);
  }
}

/* ---------------- ตัวช่วยภาพ ---------------- */
const clsOf = (k) => (D?.classes || []).find((c) => c.key === k);
function avHtml(avatar, classKey) {
  if (avatar && avatar.startsWith("assets/")) return `<img src="${esc(avatar)}" alt="">`;
  if ((!avatar || avatar === "🧪") && clsOf(classKey)?.image) return `<img src="${esc(clsOf(classKey).image)}" alt="">`;
  return esc(avatar || "🧪");
}
/* กรอบ/พื้นหลัง/หมวก/สัตว์เลี้ยง จากระบบตกแต่ง · sz: true=เล็ก, "md", "lg" */
const dcVar = (d) => (d && d.color ? `--dc:${esc(d.color)}` : "");
function frame(avatar, classKey, ri, lv, sz, dc) {
  dc = dc || {}; const f = dc.frame, b = dc.bg, size = sz === true ? "sm" : sz || "";
  return `<div class="avf rk-${ri.key} ${size} ${f ? "dc-f-" + esc(f.key) : ""}" style="${dcVar(f)}">
    <div class="av ${b ? "dc-b-" + esc(b.key) : ""}" style="${dcVar(b)}">${avHtml(avatar, classKey)}</div>
    ${dc.hat ? `<span class="dc-hat">${esc(dc.hat.emoji)}</span>` : ""}${dc.pet ? `<span class="dc-pet">${esc(dc.pet.emoji)}</span>` : ""}
    ${lv && !size ? `<span class="lv">Lv.${lv}</span>` : ""}</div>`;
}
const titleTag = (dc) => (dc && dc.title ? `<span class="pill dc-title">${esc(dc.title.emoji)} ${esc(dc.title.name)}</span>` : "");

/* ตัวละครเต็มตัว: ชุด + เอฟเฟค + ไอเทมลอย + หมวก + สัตว์เลี้ยง บนพื้นหลังและกรอบ · sz: "sm" | "md" | "lg" */
function fxHtml(fx) {
  if (!fx) return "";
  const n = fx.key === "orbit" || fx.key === "lightning" ? 4 : 11;
  let h = "";
  for (let k = 0; k < n; k++) h += `<i style="--x:${(k * 37 + 11) % 86 + 6}%;--sz:${3 + (k % 4) * 2}px;--t:${2.6 + (k % 5) * 0.6}s;--dl:-${(k * 0.55).toFixed(2)}s;--k:${k}"></i>`;
  return `<div class="fx fx-${esc(fx.key)}">${h}</div>`;
}
const GDEF = { novice: "m", alchemist: "m", scientist: "f", guardian: "m", seeker: "m" };   // เพศของภาพต้นฉบับแต่ละคลาส
const altGender = (cls, g) => !!g && g !== (GDEF[cls || "novice"] || "m");               // true = ใช้ภาพอีกเพศ (*_alt.png)
const gOf = (cls, dc) => (dc && dc.gender) || GDEF[cls || "novice"] || "m";
function stage(cls, ri, dc, sz) {
  dc = dc || {}; const f = dc.frame, b = dc.bg, o = dc.outfit, base = "assets/chars/" + (cls || "novice") + (altGender(cls, dc.gender) ? "_alt" : "");
  return `<div class="avf stg rk-${ri.key} ${sz || "md"} ${f ? "dc-f-" + esc(f.key) : ""}" style="${dcVar(f)}">
    <div class="av stage ${b ? "dc-b-" + esc(b.key) : "stg-default"}" style="${dcVar(b)}">
      ${fxHtml(dc.fx)}<div class="st-floor"></div>
      <img class="st-char" src="${base}${o ? "_" + esc(o.key) : ""}.png" alt="" onerror="this.onerror=null;this.src='${base}.png'">
      ${dc.hat ? (dc.hat.image ? `<img class="st-hat st-himg" src="${esc(dc.hat.image)}" alt="">` : `<span class="st-hat">${esc(dc.hat.emoji)}</span>`) : ""}${dc.pet ? (dc.pet.image ? `<img class="st-pet st-pimg" src="${esc(dc.pet.image)}" alt="">` : `<span class="st-pet">${esc(dc.pet.emoji)}</span>`) : ""}
      ${dc.item && dc.item.image ? `<img class="st-item" src="${esc(dc.item.image)}" alt="">` : ""}</div></div>`;
}
const itemImg = (img, emoji, cls = "ico") => img ? `<img class="${cls}" src="${esc(img)}" alt="">` : esc(emoji || "🎁");
const rankName = (ri) => ri.name + (ri.division ? " " + ri.division : "");

/* ---------------- วาดหน้า ---------------- */
function render() {
  const s = D.student, ri = D.rank_info, cls = clsOf(s.char_class);
  const span = s.exp_next_level - s.exp_this_level;
  const pct = Math.min(100, Math.round(((s.exp - s.exp_this_level) / span) * 100));
  const lp = ri.top ? "" : `<div class="lpbar"><i style="width:${ri.lp}%"></i></div>
      <div class="lvrow"><span>LP ${ri.lp} / ${ri.lp_max}</span><span>ถัดไป: ${esc(ri.next)} (EXP ${ri.exp_hi})</span></div>`;
  app.innerHTML = `
    <div class="card profile rk-${ri.key}">
      ${frame(s.avatar, s.char_class, ri, s.level, "", s.decor)}
      <div class="grow">
        <h2 style="margin:0">${esc(s.name)} <span class="muted">เลขที่ ${s.no} · ${esc(D.class.name)}</span></h2>
        ${titleTag(s.decor)}
        <div class="row" style="margin:6px 0">
          ${cls ? `<span class="pill" style="color:var(--gold2);cursor:pointer" onclick="go('class')">${esc(cls.emoji)} ${esc(cls.name)}</span>`
                : `<button class="btn small gold" onclick="go('class')">⚔️ เลือกคลาส</button>`}
          <span class="coin">🪙 ${s.coins}</span><span class="muted">EXP ${s.exp}</span>
        </div>
        <div class="lvrow"><b style="color:var(--text)">Lv.${s.level}</b><span>${s.exp - s.exp_this_level} / ${span} EXP ถึงเลเวล ${s.level + 1}</span></div>
        <div class="lvgauge"><i style="width:${pct}%"></i></div>
      </div>
      <div class="rankcard" style="flex-basis:100%">
        <img class="emb" src="${esc(ri.image)}" alt="${esc(ri.name)}" onerror="this.remove()">
        <div class="grow"><div class="rn">${esc(rankName(ri))}</div>${lp || `<div class="muted">แรงค์สูงสุด · LP ${ri.lp}</div>`}</div>
      </div>
    </div>
    <div class="navwrap ${NAVOPEN ? "open" : ""}" id="nav">
      <div class="navbar">
        <button class="navbtn" onclick="toggleNav()">☰ <b>${esc((TABS.find((t) => t[0] === tab) || ["", ""])[1])}</b> <span class="car">▾</span></button>
        <span class="grow"></span>
        <button class="bellbtn" onclick="openNotif()" aria-label="การแจ้งเตือน">🔔${notifCount() ? `<i class="bdg">${notifCount()}</i>` : ""}</button>
      </div>
      <div class="navgrid">${TABS.map(([k, l]) => `<button class="tab ${k === tab ? "on" : ""}" onclick="go('${k}')">${l}${k === "board" && B.unread ? `<i class="bdg">${B.unread}</i>` : ""}</button>`).join("")}</div>
    </div>
    <div id="view"></div>`;
  $("#view").innerHTML = VIEWS[tab]();
}
const go = (k) => { tab = k; NAVOPEN = false; closeNotif(); render(); window.scrollTo({ top: 0 }); };
const toggleNav = () => { NAVOPEN = !NAVOPEN; $("#nav").classList.toggle("open", NAVOPEN); };

/* ---------------- ศูนย์แจ้งเตือน (🔔) ---------------- */
function notifs() {
  const L = [];
  if ((X.free_pulls || 0) > 0) L.push({ k: "free" + X.free_pulls, ic: "🎟️", t: `มีตั๋วสุ่มกาชาฟรี ${X.free_pulls} ใบ`, d: "กดเพื่อไปสุ่มเลย", go: "gacha" });
  (D.assignments || []).filter((a) => !a.status && a.due_date).forEach((a) => {
    const n = dayDiff(a.due_date); if (n > 3) return;
    L.push({ k: "hw" + a.id + n, ic: n < 0 ? "🚨" : "⏰", t: `${a.title}`, d: n < 0 ? `เลยกำหนด ${-n} วัน — ส่งช้ายังได้ EXP ครึ่งหนึ่ง` : n === 0 ? "ส่งวันนี้!" : `อีก ${n} วันครบกำหนด`, go: "att" });
  });
  const b = X.boss;
  if (b && b.can_claim) L.push({ k: "bossc" + b.id, ic: "🎁", t: `ปราบ ${b.name} สำเร็จ!`, d: "กดรับรางวัลได้ที่หน้าเควส", go: "quest" });
  else if (b && !b.defeated && !b.ended) L.push({ k: "boss" + b.id, ic: "👹", t: `บอสประจำสัปดาห์: ${b.name}`, d: `HP เหลือ ${b.hp}/${b.max_hp} — ทำเควสเพื่อโจมตี`, go: "quest" });
  (D.quests || []).filter((q) => q.status === "pending").forEach((q) => L.push({ k: "qp" + q.id, ic: "🕒", t: `เควส “${q.title}” รอครูตรวจ`, d: "ครูจะอนุมัติเร็วๆ นี้", go: "quest" }));
  (D.privileges || []).filter((p) => p.status === "requested").forEach((p) => L.push({ k: "pv" + p.id, ic: "🎟️", t: `สิทธิ์ “${p.name}” รอครูอนุมัติ`, d: "", go: "bag" }));
  if (B.unread > 0) L.push({ k: "bd" + B.unread, ic: "📢", t: `มีโพสต์/ประกาศใหม่ในบอร์ด ${B.unread} รายการ`, d: "กดเพื่ออ่าน", go: "board" });
  return L;
}
const SEEN_KEY = "kb_notif_seen";
const seenSet = () => { try { return JSON.parse(localStorage.getItem(SEEN_KEY) || "[]"); } catch (e) { return []; } };
const notifCount = () => { const sn = seenSet(); return notifs().filter((n) => !sn.includes(n.k)).length; };
function openNotif() {
  const L = notifs(), sn = seenSet();
  $("#notifp")?.remove();
  const el = document.createElement("div"); el.id = "notifp"; el.className = "notifp";
  el.innerHTML = `<div class="np-bg" onclick="closeNotif()"></div><div class="np-box"><div class="row"><h3 class="grow" style="margin:0">🔔 การแจ้งเตือน</h3>
    <button class="btn ghost small" onclick="closeNotif()">✕</button></div>
    ${L.length ? L.map((n, i) => `<div class="item np-i ${sn.includes(n.k) ? "" : "new"}" onclick="goNotif(${i})"><span style="font-size:24px">${n.ic}</span>
      <div class="grow"><b>${esc(n.t)}</b><div class="muted">${esc(n.d)}</div></div><span class="muted">›</span></div>`).join("") : '<p class="muted center" style="padding:18px 0">ไม่มีการแจ้งเตือนใหม่ 🎉</p>'}
    ${L.length ? '<button class="btn small ghost" style="margin-top:8px" onclick="readAllNotif()">ทำเครื่องหมายว่าอ่านทั้งหมด</button>' : ""}</div>`;
  document.body.appendChild(el);
  window._np = L;
}
function closeNotif() { $("#notifp")?.remove(); }
function readAllNotif() { try { localStorage.setItem(SEEN_KEY, JSON.stringify(notifs().map((n) => n.k))); } catch (e) {} closeNotif(); render(); }
function goNotif(i) {
  const n = (window._np || [])[i]; if (!n) return;
  try { const sn = seenSet(); if (!sn.includes(n.k)) { sn.push(n.k); localStorage.setItem(SEEN_KEY, JSON.stringify(sn.slice(-80))); } } catch (e) {}
  go(n.go);
}

/* ---------------- บอร์ดกระดาน ---------------- */
async function markBoardSeen() { try { await rpc("board_mark_seen", { p_token: tk() }); B.unread = 0; const bg = document.querySelector("#nav .navgrid .bdg"); if (bg) bg.remove(); } catch (e) {} }
async function postBoard() {
  const t = $("#bt").value, b = $("#bb").value;
  try { await rpc("board_post", { p_token: tk(), p_title: t, p_body: b }); toast("โพสต์แล้ว ✅"); await load(); } catch (e) { toast(e.message); }
}
async function delBoard(id) {
  if (!confirm("ลบโพสต์นี้?")) return;
  try { await rpc("board_delete", { p_token: tk(), p_id: id }); toast("ลบแล้ว"); await load(); } catch (e) { toast(e.message); }
}
const ago = (iso) => { const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)); return m < 1 ? "เมื่อสักครู่" : m < 60 ? m + " นาทีที่แล้ว" : m < 1440 ? Math.round(m / 60) + " ชม.ที่แล้ว" : Math.round(m / 1440) + " วันที่แล้ว"; };
function boardHtml() {
  return `<div class="card"><h3>✏️ โพสต์ในบอร์ดห้อง</h3>
    <input id="bt" maxlength="80" placeholder="หัวข้อ (ไม่ใส่ก็ได้)"><textarea id="bb" rows="3" maxlength="500" placeholder="พิมพ์ข้อความ… (ไม่เกิน 500 ตัวอักษร · โพสต์ได้วันละ 3 ครั้ง · ใช้ถ้อยคำสุภาพ)" style="margin-top:6px"></textarea>
    <button class="btn gold" style="margin-top:8px" onclick="postBoard()">📮 โพสต์</button></div>
    ${B.posts.map((p) => `<div class="card post ${p.author_kind} ${p.pinned ? "pin" : ""}">
      <div class="row"><b class="grow">${p.pinned ? "📌 " : ""}${p.author_kind === "teacher" ? "👨‍🏫 " : ""}${esc(p.author)}${p.all_classes ? ' <span class="tag late">ทุกห้อง</span>' : ""}</b>
        <span class="muted">${ago(p.created_at)}</span>${p.mine ? `<button class="btn ghost small" onclick="delBoard('${p.id}')">🗑️</button>` : ""}</div>
      ${p.title ? `<h3 style="margin:6px 0 2px">${esc(p.title)}</h3>` : ""}<div class="pbody">${esc(p.body).replace(/\n/g, "<br>")}</div></div>`).join("") || '<p class="muted">ยังไม่มีโพสต์</p>'}`;
}

const statusTag = (st) => ({
  present: '<span class="tag ok">มา</span>', late: '<span class="tag late">สาย</span>',
  absent: '<span class="tag no">ขาด</span>', leave: '<span class="tag leave">ลา</span>',
  submitted: '<span class="tag ok">ส่งแล้ว</span>', missing: '<span class="tag no">ไม่ส่ง</span>',
  pending: '<span class="tag wait">รอครูตรวจ</span>', approved: '<span class="tag ok">สำเร็จ ✔</span>',
  rejected: '<span class="tag no">ไม่ผ่าน</span>',
}[st] || "");

/* หอเกียรติยศ: Top 3 ของห้องตัวเอง (ตัวละครเต็มตัว) */
function hallHtml() {
  const r = (HOF || [])[0]; if (!r) return "";
  const pod = (x, place) => !x ? '<div class="pod empty"></div>' : `<div class="pod p${place}">
      ${place === 1 ? '<div class="crown">👑</div>' : ""}${stage(x.char_class, x.rank_info, x.decor, place === 1 ? "md" : "sm")}
      <div class="pn ${x.me ? "me" : ""}">${esc(x.name)}</div>${titleTag(x.decor)}
      <div class="muted" style="color:var(--rc)" ><span class="rk-${x.rank_info.key}">${esc(rankName(x.rank_info))}</span></div>
      <div class="muted">Lv.${x.level} · ${x.exp} EXP</div><div class="base">${place}</div></div>`;
  return `<div class="card hof"><h3>🏆 หอเกียรติยศ ${esc(r.name)}</h3>
    <div class="podium">${pod(r.top[1], 2)}${pod(r.top[0], 1)}${pod(r.top[2], 3)}</div></div>`;
}

/* ---------------- ตัวเตือนงาน · ทีม · บอส ---------------- */
const dayDiff = (d) => Math.round((new Date(String(d).slice(0, 10) + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 86400000);
const subInfo = (id) => (X.submit || {})[id] || {};
const canSubmit = (a) => ["online", "photo"].includes(subInfo(a.id).mode) && (!a.status || a.status === "missing");
function submitBtn(a) {
  const m = subInfo(a.id).mode;
  if (!canSubmit(a)) return "";
  if (m === "photo") return `<label class="btn small mint" style="cursor:pointer">📷 ส่งรูปงาน<input type="file" accept="image/*" hidden onchange="submitPhoto('${a.id}',this)"></label>`;
  return `<button class="btn small mint" onclick="submitOnline('${a.id}','${esc(a.title).replace(/'/g, "")}')">ส่งงาน ✔</button>`;
}
function remindHtml() {
  const list = D.assignments.filter((a) => !a.status && a.due_date).map((a) => ({ a, n: dayDiff(a.due_date) }))
    .filter((x) => x.n <= 3).sort((x, y) => x.n - y.n);
  const tk0 = (X.free_pulls || 0) > 0

const AUTO_HINT = { attendance: "ครูเช็คชื่อว่ามาเรียน", login: "เข้าสู่ระบบวันนี้", quiz: "ทำควิซประจำวัน (แท็บเกม)", quiz_perfect: "ตอบควิซถูกทุกข้อ",

const STN = [["int", "🧠", "ปัญญา", "โบนัส EXP ควิซ"], ["dil", "💪", "ขยัน", "EXP เช็คชื่อ/งาน/เควส"], ["str", "⚔️", "พลังโจมตี", "ดาเมจบอส"], ["luk", "🍀", "โชค", "โอกาสได้ SR/SSR"]];
/* กราฟเรดาร์ค่าสเตตัส (5 แกน) — draft = ชุดที่กำลังเลือกอยู่ (ยังไม่บันทึก) */
const SLOTS = [["outfit", "👕", "ชุด"], ["fx", "✨", "เอฟเฟค"], ["item", "🧪", "ไอเทมถือ"], ["hat", "🎩", "หมวก"], ["pet", "🐾", "สัตว์เลี้ยง"], ["frame", "🖼️", "กรอบ"], ["bg", "🌄", "พื้นหลัง"], ["title", "🏷️", "ฉายา"]];
function statTotals(dc) {
  const S = X.stats || {}, IS = X.item_stats || {}, o = {};
  const add = (k) => Object.entries(dc || {}).reduce((a, [sl, it]) => a + (it && it.id && IS[it.id] ? +IS[it.id][k] || 0 : 0), 0);
  ["int", "dil", "str", "luk"].forEach((k) => { const b = (S[k] || {}).base || 0; o[k] = { base: b, item: add(k), total: b + add(k) }; });
  o.coin = add("coin");
  return o;
}
function radarHtml(dc, size = 250) {
  if (!X.stats) return "";
  const T = statTotals(dc), AX = [["int", "🧠", "ปัญญา", T.int.total], ["dil", "💪", "ขยัน", T.dil.total], ["str", "⚔️", "พลัง", T.str.total], ["luk", "🍀", "โชค", T.luk.total], ["coin", "🪙", "เหรียญ%", T.coin]];
  const MAXV = 12, cx = size / 2, cy = size / 2 + 4, R = size * 0.32, n = AX.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const ring = (f) => AX.map((_, i) => pt(i, R * f).map((v) => v.toFixed(1)).join(",")).join(" ");
  const poly = AX.map(([, , , v], i) => pt(i, R * Math.min(1, v / MAXV)).map((x) => x.toFixed(1)).join(",")).join(" ");
  const grid = [0.25, 0.5, 0.75, 1].map((f) => `<polygon points="${ring(f)}" fill="none" stroke="#6a52c4" stroke-opacity="${f === 1 ? 0.9 : 0.45}" stroke-width="1"/>`).join("");
  const axes = AX.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#6a52c4" stroke-opacity=".45"/>`; }).join("");
  const dots = AX.map(([, , , v], i) => { const [x, y] = pt(i, R * Math.min(1, v / MAXV)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#ffd86b" stroke="#1b1238"/>`; }).join("");
  const labels = AX.map(([k, ic, nm, v], i) => { const [x, y] = pt(i, R + 26); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="11" fill="#e9e2ff"><tspan x="${x.toFixed(1)}">${ic} ${nm}</tspan><tspan x="${x.toFixed(1)}" dy="13" font-weight="700" fill="#ffd86b">${v}${k !== "coin" && T[k].item ? `<tspan fill="#7ee0b0" font-size="10"> (+${T[k].item})</tspan>` : ""}</tspan></text>`; }).join("");
  const E = { quiz: Math.floor(T.int.total / 2), exp: T.dil.total, boss: 3 * T.str.total, rare: 3 * T.luk.total };
  return `<div class="radar"><svg viewBox="0 0 ${size} ${size + 14}" width="100%" style="max-width:${size + 40}px" role="img" aria-label="กราฟสเตตัส">${grid}${axes}
      <polygon points="${poly}" fill="#9b6bff" fill-opacity=".38" stroke="#c9a8ff" stroke-width="2" stroke-linejoin="round"/>${dots}${labels}</svg>
    <div class="radfx"><span>🧠 +${E.quiz} EXP/ควิซ</span><span>💪 +${E.exp}% EXP</span><span>⚔️ +${E.boss}% ดาเมจบอส</span><span>🍀 +${E.rare}% SR/SSR</span>${T.coin ? `<span>🪙 +${T.coin}% เหรียญ</span>` : ""}</div></div>`;
}

  bag() {

    if (!DRAFT) { DRAFT = {}; SLOTS.forEach(([k]) => { if (eq[k]) DRAFT[k] = eq[k]; }); }

    let items = cat.filter((d) => d.slot === decSlot);

    const stBadge = (d) => { const t = (X.item_stats || {})[d.id]; if (!t) return ""; const parts = STN.filter(([k]) => t[k]).map(([k, ic]) => `${ic}+${t[k]}`); if (+t.coin) parts.push(`🪙+${t.coin}%`); return `<span class="stb">${parts.join(" ")}</span>${t.ability ? `<span class="abl">${esc(t.ability)}</span>` : ""}`; };

    const slotBtn = ([k, ic, lb]) => { const it = DRAFT[k]; const ch = changed.includes(k);

        <span class="si">${it ? (it.image ? `<img src="${esc(it.image)}" alt="">` : esc(it.emoji)) : ic}</span><span class="sl">${lb}</span><small>${it ? esc(it.name) : k === "outfit" ? "ชุดเริ่มต้น" : "— ว่าง —"}</small></button>`; };
    return `<div class="card"><h3>🎨 ตัวละครของฉัน</h3>
      <div class="charrow"><div class="stagecol">${stage(s.char_class, ri, prevDc, "lg")}${titleTag(DRAFT)}
        <div class="row" style="justify-content:center;gap:6px;margin-top:8px"><span class="muted">เพศ</span>
        ${[["m", "👦 ชาย"], ["f", "👧 หญิง"]].map(([g, l]) => `<button class="btn small ${gOf(s.char_class, eq) === g ? "gold" : "ghost"}" onclick="setGender('${g}')">${l}</button>`).join("")}</div>
        ${altGender(s.char_class, eq.gender) && DRAFT.outfit ? '<p class="muted" style="font-size:12px">* ชุดนี้ยังไม่มีภาพของเพศที่เลือก จึงแสดงตัวพื้นฐานแทนไปก่อน</p>' : ""}</div>
        <div class="radarcol"><div class="muted center" style="margin-bottom:2px">📊 สเตตัสประกอบ${changed.length ? " (ตัวอย่างตามที่เลือก)" : ""}</div>${radarHtml(DRAFT)}</div></div>
      <div class="slotbar">${SLOTS.map(slotBtn).join("")}</div>
      <div class="savebar ${changed.length ? "on" : ""}"><span>${changed.length ? `✏️ เปลี่ยน ${changed.length} ช่อง ยังไม่ได้บันทึก` : "เลือกไอเทมด้านล่างเพื่อลองใส่ แล้วกดบันทึก"}</span>
        <span><button class="btn ghost small" ${changed.length ? "" : "disabled"} onclick="resetDraft()">↩︎ ยกเลิก</button>
        <button class="btn gold" ${changed.length ? "" : "disabled"} onclick="saveDraft()">💾 บันทึก</button></span></div>
      <p class="muted center" style="margin:6px 0 0">สะสมแล้ว ${owned}/${cat.length} ชิ้น · เหรียญ <span class="coin">🪙 ${s.coins}</span> · ได้ไอเทมจาก <a href="#" onclick="go('gacha');return false" style="color:var(--gold2)">กาชา</a> หรือซื้อด้านล่าง</p></div>
      <div class="card"><h3>${(SLOTS.find((x) => x[0] === decSlot) || [])[1]} ${(SLOTS.find((x) => x[0] === decSlot) || [])[2]}</h3><div class="dgrid">${items.map(tile).join("") || '<p class="muted">ยังไม่มีไอเทมในหมวดนี้</p>'}</div></div>
      ${statsHtml()}`;

  shop() {
    return `<div class="card"><h3>🛒 ร้านสิทธิพิเศษ</h3><p class="muted">เหรียญของคุณ <span class="coin">🪙 ${D.student.coins}</span></p>
      ${D.shop.map((p) => `<div class="item"><span style="font-size:26px">${esc(p.emoji)}</span><div class="grow"><b>${esc(p.name)}</b>
        <div class="muted">${esc(p.description || "")}</div></div>
        <button class="btn small gold" ${D.student.coins < p.cost ? "disabled" : ""} onclick="buy('${p.id}')">${p.cost} 🪙</button></div>`).join("") || '<p class="muted">ยังไม่มีสินค้า</p>'}</div>`;
  },

  rank() {
    const me = D.rank_info;
    return `${hallHtml() || '<div class="card hof center"><h3>🏆 หอเกียรติยศ</h3><p class="muted">ยังไม่มีอันดับ — สะสม EXP จากเช็คชื่อ ส่งงาน เควส และมินิเกมเพื่อขึ้นโพเดียม</p></div>'}
    <div class="card"><h3>🏆 อันดับห้อง ${esc(D.class.name)} (Top 10)</h3>
      ${D.leaderboard.map((l, i) => `<div class="item" ${l.me ? 'style="background:#3a2a6b;border-radius:10px;padding-left:8px"' : ""}>
        <b style="width:28px">${["🥇", "🥈", "🥉"][i] || i + 1}</b>${frame(l.avatar, l.char_class, l.rank_info, 0, true, l.decor)}
        <div class="grow">${esc(l.name)} ${titleTag(l.decor)}<div class="muted rk-${l.rank_info.key}" style="color:var(--rc)">${esc(rankName(l.rank_info))}${clsOf(l.char_class) ? " · " + esc(clsOf(l.char_class).name) : ""}</div></div>

      <div class="ranktable">${(D.ranks || []).map((r) => `<div class="rk-${r.key} ${r.key === me.key ? "me" : ""}"><img src="${esc(r.image)}" alt=""><br><b style="color:var(--rc)">${esc(r.name)}</b><br><span class="muted">${r.min_exp}+ EXP</span></div>`).join("")}</div></div>`;
  },
};

/* ---------------- การกระทำ ---------------- */
async function act(fn, okMsg) {
  try { const r = await fn(); await load(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message); }
}
const claim = (id) => act(() => rpc("claim_quest", { p_token: tk(), p_quest: id }), "ส่งเควสแล้ว รอครูตรวจ ✅");
const buy = (id) => confirm("ยืนยันการแลกสิทธิพิเศษ?") && act(() => rpc("buy_privilege", { p_token: tk(), p_privilege: id }), "แลกสำเร็จ 🎉 ดูได้ในหน้า “คลัง”");
const usePriv = (id) => confirm("ขอใช้สิทธิ์นี้ ครูจะเป็นผู้อนุมัติ")
  && act(() => rpc("request_privilege", { p_token: tk(), p_redemption: id }), "ส่งคำขอให้ครูแล้ว");
const pickClass = (k, n) => confirm("เลือกคลาส “" + n + "” ?") && act(() => rpc("choose_class", { p_token: tk(), p_key: k }), "เปลี่ยนคลาสแล้ว ⚔️");
const buyDecor = (id, n, p) => confirm(`ซื้อ “${n}” ราคา ${p} เหรียญ?`) && act(() => rpc("buy_decor", { p_token: tk(), p_item: id }), "ซื้อสำเร็จ 🎉 กด “สวมใส่” ได้เลย");
const pickDecor = (slot, id) => { const it = id ? (D.decor_catalog || []).find((d) => d.id === id) : null; if (it) DRAFT[slot] = it; else delete DRAFT[slot]; render(); };
const resetDraft = () => { DRAFT = null; render(); };
const saveDraft = () => act(async () => {
  const eq = D.student.decor || {};
  for (const [k] of SLOTS) { const cur = eq[k] ? eq[k].id : null, nxt = DRAFT[k] ? DRAFT[k].id : null; if (cur !== nxt) await rpc("equip_decor", { p_token: tk(), p_slot: k, p_item: nxt }); }
}, "บันทึกการแต่งตัวแล้ว ✨");
const setGender = (g) => act(() => rpc("set_gender", { p_token: tk(), p_gender: g }), "เปลี่ยนเพศตัวละครแล้ว ✨");
const equipDecor = (slot, id) => act(() => rpc("equip_decor", { p_token: tk(), p_slot: slot, p_item: id }), id ? "สวมใส่แล้ว ✨" : "ถอดออกแล้ว");
const claimBoss = () => act(() => rpc("boss_claim", { p_token: tk() }), "รับรางวัลปราบบอสแล้ว 🎉");
const submitOnline = (id, t) => confirm(`ส่งงาน “${t}” ?`) && act(async () => { const r = await rpc("submit_assignment", { p_token: tk(), p_assignment: id }); toast(`ส่งแล้ว ✅ ได้ +${r.exp} EXP ทันที`, 3500); return r; });
async function shrink(file, max = 1280, q = 0.72) {
  let bmp; try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) { bmp = await createImageBitmap(file); }
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
  c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob(res, "image/jpeg", q));
}
async function submitPhoto(id, input) {
  const f = input.files && input.files[0]; if (!f) return;
  toast("กำลังอัปโหลดรูป…", 12000);
  try {
    const blob = await shrink(f); if (!blob) throw new Error("อ่านรูปไม่สำเร็จ");
    if (blob.size > 1500000) throw new Error("รูปใหญ่เกินไป ลองถ่ายใหม่");
    const slot = await rpc("begin_upload", { p_token: tk(), p_assignment: id });
    const up = await sb.storage.from("submissions").upload(slot + ".jpg", blob, { contentType: "image/jpeg", upsert: false });
    if (up.error) throw new Error("อัปโหลดไม่สำเร็จ: " + up.error.message);
    const r = await rpc("submit_assignment", { p_token: tk(), p_assignment: id, p_slot: slot });
    await load(); toast(`ส่งงานแล้ว ✅ ได้ +${r.exp} EXP ทันที`, 3500);
  } catch (e) { toast(e.message); }
  input.value = "";
}
const setAv = (id) => act(() => rpc("set_avatar", { p_token: tk(), p_item: id }), "เปลี่ยนอวาตาร์แล้ว");

async function pull(n) {
  try {
    const r = await rpc("gacha_pull", { p_token: tk(), p_n: n });
    const ov = $("#overlay");
    ov.innerHTML = `<h2>✨ ผลการสุ่ม</h2><div id="cards">${r.items.map((it, i) => `
      <div class="gcard rar-${it.rarity}" id="gc${i}"><div class="in"><div class="b"></div>
      <div class="f"><div><div class="e">${itemImg(it.image, it.emoji, "gi")}</div><div class="rar">${it.rarity}</div><div class="n">${esc(it.name)}</div>${it.kind === "decor" ? `<div class="n muted">${it.dup_refund ? "ซ้ำ! คืน +" + it.dup_refund + "🪙" : "🎨 ไอเทมตกแต่งใหม่!"}</div>` : ""}</div></div></div></div>`).join("")}</div>
      <p><button class="btn gold" onclick="closeOv()">รับของ</button></p>`;
    ov.classList.add("on");
    r.items.forEach((_, i) => setTimeout(() => $("#gc" + i)?.classList.add("flip"), 350 + i * 330));
    await load();
  } catch (e) { toast(e.message); }
}
function closeOv() { $("#overlay").classList.remove("on"); }

load();
</script>

<canvas id="fx"></canvas>
<script>
/* เอฟเฟกต์แสง: ประกายลอย + แสงตามเมาส์บนการ์ด */
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var c=document.getElementById("fx"),x=c.getContext("2d"),P=[],W,H;
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight}
  rs();addEventListener("resize",rs);
  var n=innerWidth<600?28:55,cols=["#ffd75a","#b48cff","#7fe9ff","#ffffff"];
  for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,
    v:Math.random()*.35+.08,t:Math.random()*6.28,c:cols[i%4]});
  (function f(){x.clearRect(0,0,W,H);
    P.forEach(function(p){p.y-=p.v;p.t+=.03;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      x.globalAlpha=.25+.55*Math.abs(Math.sin(p.t));x.fillStyle=p.c;x.shadowColor=p.c;x.shadowBlur=8;
      x.beginPath();x.arc(p.x+Math.sin(p.t)*6,p.y,p.r,0,6.28);x.fill()});
    requestAnimationFrame(f)})();
  document.addEventListener("pointermove",function(e){
    var el=e.target.closest&&e.target.closest(".card");if(!el)return;
    var b=el.getBoundingClientRect();
    el.style.setProperty("--mx",(e.clientX-b.left)+"px");el.style.setProperty("--my",(e.clientY-b.top)+"px")});
})();
</script>
</body>
