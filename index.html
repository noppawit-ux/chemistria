/* โหมดส่องนักเรียน (ครูเปิดจากหน้าครู): ใช้โทเคนใน sessionStorage อ่านอย่างเดียว ไม่แตะ login จริง */

/* ---------------- แทนอิโมจิด้วยไอคอนภาพ (ทั้งหน้า อัตโนมัติ) ---------------- */
const EMO = { "🧠": "quiz", "⚗️": "match", "⚗": "match", "🔮": "spell", "🏆": "trophy", "⚔️": "battle", "⚔": "battle", "🤝": "duel", "💪": "muscle", "🍀": "clover", "🔥": "fire", "⏰": "alarm", "📷": "camera", "🎨": "palette", "🎁": "giftbox", "🎟️": "ticket", "🎟": "ticket", "👹": "boss", "🪙": "coin", "❤️": "heart", "✅": "check", "🔒": "lock", "🔔": "bell" };
const EMO_RE = new RegExp(Object.keys(EMO).sort((a, b) => b.length - a.length).join("|"), "g");
let EMO_Q = false;
function emoSwap(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => !n.nodeValue || !/[\u2600-\u27BF\u{1F300}-\u{1FAFF}]/u.test(n.nodeValue) || n.parentNode.closest("svg,script,style,textarea,option,select,title") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const list = []; while (w.nextNode()) list.push(w.currentNode);
  for (const n of list) {
    const t = n.nodeValue; EMO_RE.lastIndex = 0; if (!EMO_RE.test(t)) continue;
    const f = document.createDocumentFragment(); let last = 0; EMO_RE.lastIndex = 0; let m;
    while ((m = EMO_RE.exec(t))) { if (m.index > last) f.append(t.slice(last, m.index)); const i = document.createElement("img"); i.className = "em"; i.alt = ""; i.draggable = false; i.src = `assets/icons/${EMO[m[0]]}.png`; f.append(i); last = m.index + m[0].length; }
    if (last < t.length) f.append(t.slice(last)); n.replaceWith(f);
  }
}
new MutationObserver(() => { if (EMO_Q) return; EMO_Q = true; requestAnimationFrame(() => { EMO_Q = false; try { emoSwap(document.body); } catch (e) {} }); }).observe(document.body || document.documentElement, { childList: true, subtree: true, characterData: true });

/* ---------------- ไอคอนภาพแทนอิโมจิ ---------------- */
const ic = (k, c = "") => `<img class="ico ${c}" src="assets/icons/${k}.png" alt="" draggable="false" onerror="this.replaceWith(document.createTextNode(''))">`;
const tabHtml = ([k, l]) => `${ic(k)}<span>${esc(l.replace(/^\S+\s/, ""))}</span>`;

/* ---------------- สไลด์ข่าว/อีเว้นท์ หน้าแรก ---------------- */
let NEWS_I = 0, NEWS_T = null;
function newsSlides() {
  const sl = [{ kind: "update", title: `อัปเดตใหม่ v${APP_VERSION}`, summary: PATCH.items.map((i) => i[1]).slice(0, 2).join(" · "), image: PATCH.img || "assets/patch-banner.jpg", act: "patchShow(true)" }];
  NEWS.forEach((n, i) => sl.push({ ...n, act: `newsOpen(${i})` }));
  return sl;
}
function newsHtml() {
  const sl = newsSlides(); if (!sl.length) return "";
  const lab = { update: "อัปเดต", news: "ข่าว", event: "อีเว้นท์" };
  return `<div class="card newscard"><div class="newshead">${ic("news")}<b>ข่าวสาร &amp; อีเว้นท์</b></div>
    <div class="newsc" id="newsc">${sl.map((n, i) => `<button class="newss" data-i="${i}" onclick="${n.act}" aria-label="${esc(n.title)}">
      <img src="${esc(n.image || "assets/patch-banner.jpg")}" alt="" loading="lazy" draggable="false" onerror="this.style.display='none'">
      <span class="newsg"></span><span class="newsk k-${n.kind}">${ic(n.kind === "event" ? "event" : "news")}${lab[n.kind] || "ข่าว"}</span>
      <span class="newst"><b>${esc(n.title)}</b><small>${esc(n.summary || "")}</small></span></button>`).join("")}</div>
    <div class="newsd" id="newsd">${sl.map((_, i) => `<i class="${i === 0 ? "on" : ""}" onclick="newsTo(${i})"></i>`).join("")}</div></div>`;
}
function newsTo(i) { const c = document.getElementById("newsc"); if (c) c.scrollTo({ left: c.clientWidth * i, behavior: "smooth" }); }
function newsInit() {
  clearInterval(NEWS_T); const c = document.getElementById("newsc"); if (!c) return;
  const n = c.children.length, dots = document.querySelectorAll("#newsd i");
  c.onscroll = () => { NEWS_I = Math.round(c.scrollLeft / c.clientWidth); dots.forEach((d, i) => d.classList.toggle("on", i === NEWS_I)); };
  if (n > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches) NEWS_T = setInterval(() => {
    if (document.hidden || tab !== "home" || document.getElementById("newsov")) return;
    newsTo((Math.round(c.scrollLeft / c.clientWidth) + 1) % n);
  }, 5000);
}
function newsOpen(i) {
  const n = NEWS[i]; if (!n) return;
  const d = (x) => x ? new Date(x + "T00:00:00").toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" }) : "";
  const when = n.starts_at || n.ends_at ? `<div class="muted" style="text-align:center">${ic("cal", "sm")} ${n.starts_at ? d(n.starts_at) : ""}${n.starts_at && n.ends_at ? " – " : n.ends_at ? "ถึง " : ""}${n.ends_at ? d(n.ends_at) : ""}</div>` : "";
  const ov = document.createElement("div"); ov.id = "newsov"; ov.className = "patchov-like"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true");
  ov.innerHTML = `<div class="patchbox"><button class="patchx" aria-label="ปิด" onclick="newsClose()">✕</button>
    ${n.image ? `<div class="patchimgw"><img class="patchimg" src="${esc(n.image)}" alt="" onerror="this.parentNode.remove()"></div>` : ""}
    <div class="patchh">${ic(n.kind === "event" ? "event" : "news")} ${esc(n.title)}</div>${when}
    <div class="newsbody">${esc(n.body || n.summary || "").replace(/\n/g, "<br>")}</div>
    <div class="row" style="justify-content:center"><button class="btn gold" onclick="newsClose()">ปิด</button></div></div>`;
  ov.addEventListener("click", (e) => { if (e.target === ov) newsClose(); });
  document.body.appendChild(ov);
}
function newsClose() { document.getElementById("newsov")?.remove(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") newsClose(); });

/* ---------------- ประกาศอัปเดต (patch notes) ---------------- */
const APP_VERSION = "1.47";
const PATCH = {
  id: "2026-11-07b", ver: APP_VERSION, title: "ไอเทมใหม่มาแล้ว! 🎉", date: "7 พ.ย. 2569", img: "assets/news/items.jpg",
  items: [
    ["🎩", "ไอเทมตกแต่งใหม่ 14 ชิ้น", "หมวกพ่อมดธาตุ มงกุฎลอเรล หุ่นยนต์จิ๋ว สไลม์สารเคมี ฟีนิกซ์น้อย เพชรคาร์บอน พื้นภูเขาไฟ/ถ้ำผลึก กรอบอเมทิสต์ และฉายาใหม่ — ซื้อในแท็บ ตกแต่ง หรือลุ้นจากกาชา"],
    ["🥋", "ชุดตัวละครใหม่ 2 แบบ", "ชุดฮาซ์แมท (R ซื้อได้ 300 เหรียญ) และชุดซามูไรนักเคมี (SSR จากกาชา) ครบทุกคลาส"],
    ["📣", "สไลด์ข่าว & อีเว้นท์ที่หน้าหลัก", "ข่าวและกิจกรรมใหม่ๆ จะขึ้นเป็นสไลด์ กดดูรายละเอียดได้ · ไอคอนภาพใหม่ทั้งระบบ · จัดหน้าอันดับใหม่"],
    ["🏆", "ก่อนหน้านี้", "โหมดประลองครูบุ๊ค · ปรับแรงค์ใหม่ · ช่องอุปกรณ์ข้างตัวละคร (ดูย้อนหลังได้ที่ข่าวในสไลด์)"],
  ],
};
document.addEventListener("visibilitychange", () => document.documentElement.classList.toggle("anim-off", document.hidden));
const PATCH_KEY = "chem_patch_seen";
function patchShow(force) {
  if (PEEK || !D) return;
  let seen = null; try { seen = localStorage.getItem(PATCH_KEY); } catch (e) {}
  if (!force && seen === PATCH.id) return;
  if (document.getElementById("patchov")) return;
  const ov = document.createElement("div"); ov.id = "patchov"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true");
  ov.innerHTML = `<div class="patchbox"><button class="patchx" aria-label="ปิด" onclick="patchClose()">✕</button>
    <div class="patchimgw"><img class="patchimg" src="${esc(PATCH.img || "assets/patch-banner.jpg")}" alt="" onerror="this.parentNode.remove()"></div><div class="patchh">📢 ${esc(PATCH.title)} <span class="patchver">v${esc(PATCH.ver)}</span></div><div class="muted" style="text-align:center">ประกาศอัปเดต · ${esc(PATCH.date)}</div>
    <div class="patchl">${PATCH.items.map((i) => `<div class="patchi"><span>${i[0]}</span><div><b>${esc(i[1])}</b><div class="muted">${esc(i[2])}</div></div></div>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn gold" onclick="patchClose()">รับทราบ ปิดหน้านี้</button></div></div>`;
  ov.addEventListener("click", (e) => { if (e.target === ov) patchClose(); });
  document.body.appendChild(ov);
}
function patchClose() { try { localStorage.setItem(PATCH_KEY, PATCH.id); } catch (e) {} document.getElementById("patchov")?.remove(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") patchClose(); });
function peekBar() {
  let b = document.getElementById("peekbar"); if (!b) { b = document.createElement("div"); b.id = "peekbar"; document.body.appendChild(b); document.body.classList.add("peeking"); }
  b.innerHTML = `👁 โหมดส่องนักเรียน: <b>${esc(D.student.name)}</b> (อ่านอย่างเดียว · ไม่มีผลต่อคะแนน/อันดับ) <button onclick="window.close();setTimeout(()=>{location.href='admin.html'},200)">ปิด</button>`;
}
function logout() { localStorage.removeItem(TOKEN_KEY); D = null; try { sessionStorage.removeItem("kb_seen"); } catch (e) {} const k = document.getElementById("kbpop"); if (k) k.remove(); showLogin(); }
async function changePin() {
  const o = prompt("PIN เดิม"); if (o === null) return;
  const n = prompt("PIN ใหม่ (ตัวเลข 4-6 หลัก)"); if (n === null) return;
  try { await rpc("change_pin", { p_token: tk(), p_old: o, p_new: n }); toast("เปลี่ยน PIN แล้ว ✅"); }
  catch (e) { toast(e.message); }

const tk = () => PEEK || localStorage.getItem(TOKEN_KEY);

async function load() {
  if (!tk()) return showLogin();
  try {
    const prev = D;
    // โหลดพร้อมกัน (เดิมโหลดทีละอัน ช้ากว่า 3–4 เท่า); แดชบอร์ดผิดพลาด = เข้าสู่ระบบใหม่ ส่วนที่เหลือพลาดได้
    const [dash, hof, ext, brd, nws] = await Promise.all([
      rpc("student_dashboard", { p_token: tk() }),
      rpc("hall_of_fame", { p_token: tk() }).catch(() => []),
      rpc("student_extras", { p_token: tk() }).catch(() => ({})),
      rpc("board_list", { p_token: tk() }).catch(() => ({ posts: [], unread: 0 })),
      rpc("news_list", { p_token: tk() }).catch(() => []),
    ]);
    NEWS = nws || [];
    D = dash; HOF = hof || []; X = ext || {}; B = brd || { posts: [], unread: 0 };
    DRAFT = null; if (!prev) document.getElementById("fxlayer")?.replaceChildren(); setTimeout(() => document.querySelectorAll("#fxlayer .pfxg[data-loop]").forEach((e) => e.remove()), 600);
    render(); if (PEEK) peekBar(); else { kbAuto(); fxDiff(prev); celCheck(); if (!prev) patchShow(); }
  } catch (e) {
    if (!PEEK && /เซสชัน|หมดอายุ|JWT/.test(e.message || "")) localStorage.removeItem(TOKEN_KEY);   // ไม่ล้างล็อกอินเมื่อแค่เน็ตหลุด
    showLogin(e.message);
  }
}


/* ประกาศ popup แสดงความยินดี: ได้ SSR / เลื่อนแรงค์ (ของเพื่อนร่วมห้อง) */
const CEL_KEY = "chem_cel_seen"; let CELQ = [], CELBUSY = false, CELTIMER = null;
async function celCheck() {
  if (!tk()) return;
  try {
    let since = null; try { const v = localStorage.getItem(CEL_KEY); since = v === null ? null : Number(v); } catch (e) {}
    const r = await rpc("celebrations_feed", { p_token: tk(), p_since: since });
    try { localStorage.setItem(CEL_KEY, String(r.max || 0)); } catch (e) {}
    (r.items || []).forEach((x) => CELQ.push(x));
    celNext();
  } catch (e) {}
  clearTimeout(CELTIMER); CELTIMER = setTimeout(celCheck, 60000);
}
function celNext() {
  CELQ.splice(0).slice(-4).forEach((x) => {
    const who = x.mine ? "คุณ" : x.name;
    if (x.kind === "ssr") NOTE.show({ kind: "ssr", icon: x.emoji || "🎁", title: `🎉 ${who} ได้ SSR!`, text: x.title, ms: 4500 });
    else NOTE.show({ kind: "cel", icon: "🏆", title: `🎉 ${who} เลื่อนแรงค์!`, text: x.title, ms: 4500 });
  });
}
/* เอฟเฟกต์พิกเซลเมื่อค่าเปลี่ยน: เลเวล/แรงก์/เหรียญ/EXP/เหรียญตรา */
/* popup แจ้งรางวัล/เลื่อนขั้นที่มุมบนของจอ แล้วหายเอง (แทนเอฟเฟกต์เต็มจอ) */
const NOTE = (() => {
  let box = null; const MAX = 3;
  const SND = { level: "levelup", rank: "rank", reward: "coin", ach: "chime", ssr: "chime", cel: "toast" };
  function show(o) {                       // o: {kind, icon, title, text, ms}
    if (!box) { box = document.createElement("div"); box.id = "notes"; document.body.appendChild(box); }
    while (box.children.length >= MAX) box.firstChild.remove();
    const el = document.createElement("div"); el.className = "note n-" + (o.kind || "reward");
    el.innerHTML = `<span class="n-ic">${o.icon || "🎁"}</span><span class="n-tx"><b>${esc(o.title || "")}</b>${o.text ? `<small>${esc(o.text)}</small>` : ""}</span>`;
    const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 300); };
    el.onclick = close; box.appendChild(el); setTimeout(close, o.ms || 3800);
    try { if (typeof SFX !== "undefined") SFX.play(SND[o.kind] || "toast", { gap: 200 }); } catch (e) {}
  }
  return { show };
})();
function fxDiff(o) {
  if (typeof FX === "undefined" || !o || !o.student || !D || !D.student || o.student.id !== D.student.id) return;
  const a = o.student, b = D.student;
  setTimeout(() => {
    const gain = [];

function radarHtml(dc, size = 250) {
  if (!X.stats) return "";
  const T = statTotals(dc), AX = [["int", "🧠", "ปัญญา", T.int.total], ["dil", "💪", "ขยัน", T.dil.total], ["str", "⚔️", "พลัง", T.str.total], ["luk", "🍀", "โชค", T.luk.total], ["coin", "🪙", "เหรียญ%", T.coin]];
  const MAXV = 12, cx = size / 2, cy = size / 2 + 4, R = size * 0.32, n = AX.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const ring = (f) => AX.map((_, i) => pt(i, R * f).map((v) => v.toFixed(1)).join(",")).join(" ");
  const poly = AX.map(([, , , v], i) => pt(i, R * Math.min(1, v / MAXV)).map((x) => x.toFixed(1)).join(",")).join(" ");
  const grid = [0.25, 0.5, 0.75, 1].map((f) => `<polygon points="${ring(f)}" fill="none" stroke="#6a52c4" stroke-opacity="${f === 1 ? 0.9 : 0.45}" stroke-width="1"/>`).join("");
  const axes = AX.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#6a52c4" stroke-opacity=".45"/>`; }).join("");
  const dots = AX.map(([, , , v], i) => { const [x, y] = pt(i, R * Math.min(1, v / MAXV)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#ffd86b" stroke="#1b1238"/>`; }).join("");
  const labels = AX.map(([k, ic, nm, v], i) => { const [x, y] = pt(i, R + 26); return `<image href="assets/icons/${({ int: "quiz", dil: "muscle", str: "battle", luk: "clover", coin: "coin" })[k]}.png" x="${(x - 9).toFixed(1)}" y="${(y - 27).toFixed(1)}" width="18" height="18"/><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="11" fill="#e9e2ff"><tspan x="${x.toFixed(1)}">${nm}</tspan><tspan x="${x.toFixed(1)}" dy="13" font-weight="700" fill="#ffd86b">${v}${k !== "coin" && T[k].item ? `<tspan fill="#7ee0b0" font-size="10"> (+${T[k].item})</tspan>` : ""}</tspan></text>`; }).join("");

}

        ${a.status === "late" ? '<span class="tag late">ส่งช้า</span>' : a.status ? statusTag(a.status) : overdue ? '<span class="tag no">เลยกำหนด</span>' : '<span class="tag wait">ยังไม่ส่ง</span>'}${submitBtn(a)}</div>
        ${subInfo(a.id).note && (!a.status || a.status === "missing") ? `<div class="muted" style="padding:0 0 8px;color:var(--gold2)">↩️ ครูส่งคืน: ${esc(subInfo(a.id).note)} — แก้ไขแล้วส่งใหม่ได้</div>` : ""}`;
    };
    return `${remindHtml()}
    <div class="card"><h3>📝 งาน</h3>${todo.map(row).join("")}${done.map(row).join("") || ""}
      ${D.assignments.length ? "" : '<p class="muted">ยังไม่มีงาน</p>'}</div>
    <div class="card"><h3>📋 ประวัติการเข้าเรียน</h3>
      <div class="row">${D.attendance.map((a) => `<span class="pill">${fmtDate(a.date)} ${statusTag(a.status)}</span>`).join("") || '<span class="muted">ยังไม่มีข้อมูล</span>'}</div></div>`;
  },

  cal() {
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
    const byDay = {};
    const add = (d, o) => ((byDay[String(d).slice(0, 10)] ||= []).push(o));
    D.events.forEach((e) => {
      const s = new Date(e.date), en = e.end_date ? new Date(e.end_date) : s;
      for (let d = new Date(s); d <= en; d.setDate(d.getDate() + 1)) add(ymd(d), { kind: e.kind, title: e.title, note: e.note });
    });
    D.assignments.forEach((a) => a.due_date && add(a.due_date, { kind: "assignment", title: "ส่งงาน: " + a.title, note: a.status ? "" : "ยังไม่ส่ง" }));
    D.attendance.forEach((a) => add(a.date, { kind: "att", title: "เช็คชื่อ: " + STATUS_LABEL[a.status], note: "" }));
    let cells = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i); const k = ymd(d);
      const items = byDay[k] || [];
      cells += `<div class="d ${d.getMonth() !== m ? "out" : ""} ${k === todayStr() ? "today" : ""} ${k === calSel ? "sel" : ""}" onclick="calSel='${k}';render()">
        <b>${d.getDate()}</b><br>${items.filter((x) => x.kind !== "att").slice(0, 4).map((x) => `<span class="dot k-${x.kind}"></span>`).join("")}${items.some((x) => x.kind === "att") ? "✓" : ""}</div>`;
    }
    const sel = byDay[calSel] || [];
    return `<div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <button class="btn small ghost" onclick="calMonth=new Date(${y},${m - 1},1);render()">◀</button>
        <h3 style="margin:0">${TH_MONTHS[m]} ${y + 543}</h3>
        <button class="btn small ghost" onclick="calMonth=new Date(${y},${m + 1},1);render()">▶</button></div>
      <div class="cal">${TH_DAYS.map((d) => `<div class="h">${d}</div>`).join("")}${cells}</div>
      <div class="row muted" style="margin-top:8px">${Object.entries(KIND_LABEL).map(([k, l]) => `<span><span class="dot k-${k}"></span>${l}</span>`).join("")}</div></div>
      <div class="card"><h3>${fmtDate(calSel)}</h3>${sel.map((x) => `<div class="item"><span class="dot k-${x.kind === "att" ? "lesson" : x.kind}"></span><div class="grow">${esc(x.title)}<div class="muted">${esc(x.note || "")}</div></div></div>`).join("") || '<p class="muted">ไม่มีรายการ</p>'}</div>`;
  },

  score() {
    if (!D.settings.show_scores) return '<div class="card"><p class="muted">ครูปิดการแสดงคะแนนไว้ชั่วคราว</p></div>';
    const g = {};
    D.scores.forEach((s) => (g[s.category] ||= []).push(s));
    return Object.keys(CAT_LABEL).filter((c) => g[c]).map((c) => {
      const got = g[c].reduce((a, s) => a + (s.score ?? 0), 0), max = g[c].reduce((a, s) => a + Number(s.max), 0);
      return `<div class="card"><h3>${CAT_LABEL[c]} <span class="pill">${got} / ${max}</span></h3>
        ${g[c].map((s) => `<div class="item"><div class="grow">${esc(s.title)}</div><b>${s.score ?? "–"}</b><span class="muted">/ ${s.max}</span></div>`).join("")}</div>`;
    }).join("") || '<div class="card"><p class="muted">ยังไม่มีคะแนน</p></div>';
  },

  class() {
    const s = D.student, cost = D.class_change_cost;
    return `<div class="card"><h3>⚔️ เลือกคลาสของคุณ</h3>
      <p class="muted">แต่ละคลาสมีความสามารถพิเศษต่างกัน เลือกครั้งแรกฟรี หลังจากนั้นเปลี่ยนคลาสครั้งละ ${cost} 🪙</p>
      <div class="clsgrid">${D.classes.map((c) => `<div class="clscard ${c.key === s.char_class ? "on" : ""}">
        <img src="${esc(c.image)}" alt="" onerror="this.replaceWith(document.createTextNode('${esc(c.emoji)}'))">
        <h3 style="margin:.2em 0">${esc(c.emoji)} ${esc(c.name)}</h3>
        <div class="muted">${esc(c.description || "")}</div>
        <div class="ability">✨ ${esc(c.ability || "")}</div>
        ${c.key === s.char_class ? '<span class="tag ok">คลาสปัจจุบัน</span>'
          : `<button class="btn small gold" ${!D.class_free && s.coins < cost ? "disabled" : ""} onclick="pickClass('${c.key}','${esc(c.name)}')">${D.class_free ? "เลือกคลาสนี้ (ฟรี)" : `เปลี่ยน (${cost} 🪙)`}</button>`}
      </div>`).join("")}</div></div>`;
  },

  quest() {
    return `${bossHtml(true)}<div class="card"><h3>🗺️ เควสวันนี้ & รายสัปดาห์</h3><p class="muted">เควส ⚡ อัตโนมัติ: ระบบเช็คให้เอง ทำเงื่อนไขแล้วได้รางวัลทันที · เควสอื่น: ทำเสร็จแล้วกดขอรับรางวัล ครูจะตรวจแล้วให้ EXP/เหรียญ · ทุกเควสที่สำเร็จคือการโจมตีบอส ✨</p>
      ${D.quests.map((q) => `<div class="item"><div class="grow"><b>${esc(q.title)}</b> ${q.kind === "weekly" ? '<span class="pill">รายสัปดาห์</span>' : ""}

  gacha() {

      <p class="muted">การันตี SR ขึ้นไปเมื่อสุ่มไม่ได้ครบ ${pm} ครั้ง (สะสม ${s.pity}/${pm - 1})</p>

      ${D.gacha_pool.map((g) => `<span class="pill rar-${g.rarity}" style="border-color:var(--c)">${itemImg(g.image, g.emoji)} ${esc(g.name)} <b class="rar">${g.rarity}</b></span>`).join("")}</div></div>`;

  bag() {
    return `<div class="card"><h3>🏅 Achievement</h3><div class="grid">
      ${D.achievements.map((a) => {
        const p = Math.min(100, Math.round((a.progress / a.threshold) * 100));
        return `<div class="card" style="margin:0;${a.earned_at ? "border-color:var(--gold)" : "opacity:.8"}">
          <div class="medal ${a.earned_at ? "" : "off"}">${a.image ? `<img src="${esc(a.image)}" alt="">` : `<span style="font-size:30px">${esc(a.emoji)}</span>`}</div><b>${esc(a.name)}</b>
          <div class="muted">${esc(a.description || "")}</div>
          ${a.earned_at ? `<span class="tag ok">ได้รับแล้ว ${fmtDate(a.earned_at)}</span>`
            : `<div class="bar" style="margin-top:6px"><i style="width:${p}%"></i></div><span class="muted">${Math.min(a.progress, a.threshold)}/${a.threshold}</span>`}
          <div class="muted">รางวัล ${a.reward_exp ? `+${a.reward_exp} EXP ` : ""}${a.reward_coins ? `+${a.reward_coins} 🪙` : ""}</div></div>`;
      }).join("")}</div></div>
    <div class="card"><h3>🎟️ สิทธิพิเศษของฉัน</h3>
      ${D.privileges.map((p) => `<div class="item"><span style="font-size:26px">${esc(p.emoji)}</span><div class="grow"><b>${esc(p.name)}</b>
        <div class="muted">${esc(p.description || "")}</div></div>
        ${p.status === "available" ? `<button class="btn small gold" onclick="usePriv('${p.id}')">ขอใช้สิทธิ์</button>`
          : p.status === "requested" ? '<span class="tag wait">รอครูอนุมัติ</span>'
          : p.status === "approved" ? '<span class="tag ok">ใช้แล้ว</span>' : '<span class="tag no">ไม่อนุมัติ</span>'}</div>`).join("") || '<p class="muted">ยังไม่มีสิทธิพิเศษ ลองสุ่มกาชาหรือแลกในร้านค้า</p>'}</div>
    <div class="card"><h3>🧑‍🔬 อวาตาร์ที่สะสม</h3><div class="row">
      <button class="btn small ghost" onclick="setAv(null)">🧪 ค่าเริ่มต้น</button>
      ${D.inventory.map((i) => `<button class="btn small ${i.equipped ? "gold" : "ghost"}" onclick="setAv('${i.item_id}')">${itemImg(i.image, i.emoji)} ${esc(i.name)}${i.qty > 1 ? " ×" + i.qty : ""}</button>`).join("")}</div></div>`;
  },

  decor() {
    const s = D.student, eq = s.decor || {}, ri = D.rank_info, cat = D.decor_catalog || [];
    if (!DRAFT) { DRAFT = {}; SLOTS.forEach(([k]) => { if (eq[k]) DRAFT[k] = eq[k]; }); }
    const idOf = (o, k) => (o && o[k] ? o[k].id : null);
    const changed = SLOTS.filter(([k]) => idOf(DRAFT, k) !== idOf(eq, k)).map(([k]) => k);
    const prevDc = { ...DRAFT, gender: eq.gender };
    let items = cat.filter((d) => d.slot === decSlot);
    if (decSlot === "outfit") items = [{ id: null, slot: "outfit", name: "ชุดเริ่มต้น", emoji: "👤", rarity: "N", owned: true, price: null }, ...items];
    const owned = cat.filter((d) => d.owned).length;
    const stBadge = (d) => { const t = (X.item_stats || {})[d.id]; if (!t) return ""; const parts = STN.filter(([k]) => t[k]).map(([k, ic]) => `${ic}+${t[k]}`); if (+t.coin) parts.push(`🪙+${t.coin}%`); return `<span class="stb">${parts.join(" ")}</span>${t.ability ? `<span class="abl">${esc(t.ability)}</span>` : ""}`; };
    const tile = (d) => {
      const sel = d.id === null ? !DRAFT.outfit : DRAFT[d.slot] && DRAFT[d.slot].id === d.id;
      const next = { ...DRAFT, gender: eq.gender }; if (d.id === null) delete next.outfit; else next[d.slot] = d;
      // หน้าไอเทม: แสดงเฉพาะรูป/ไอคอนของไอเทม (ตัวอย่างเต็มตัวอยู่ด้านบนของหน้า) — กรอบ/พื้นหลังแสดงบนอวาตาร์วงเล็กเพื่อให้เห็นลาย
      const big = d.image ? `<img class="dimg" src="${esc(d.image)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'demo',textContent:'${esc(d.emoji || "🎁")}'}))">` : `<span class="demo">${esc(d.emoji || "🎁")}</span>`;
      const oimg = (cls0, d0) => `assets/chars/${cls0 || "novice"}${d0.id === null ? (altGender(cls0, eq.gender) ? "_alt" : "") : "_" + d0.key}.png`;
      const outfitPrev = d.slot === "outfit" ? `<img class="dimg outfit" src="${esc(oimg(s.char_class, d))}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'demo',textContent:'${esc(d.emoji || "👕")}'}))">` : null;
      const prev = outfitPrev ? outfitPrev : d.slot === "title" ? titleTag({ title: d }) : (d.slot === "frame" || d.slot === "bg") ? frame(s.avatar, s.char_class, ri, 0, true, next) : big;
      const act = d.owned ? (sel ? (d.id === null ? '<span class="tag ok">เลือกอยู่</span>' : `<button class="btn small ghost" onclick="pickDecor('${d.slot}',null)">ถอดออก</button>`)
            : `<button class="btn small gold" onclick="pickDecor('${d.slot}',${d.id === null ? "null" : `'${d.id}'`})">เลือก</button>`)
          : d.price != null ? `<button class="btn small" ${s.coins < d.price ? "disabled" : ""} onclick="buyDecor('${d.id}','${esc(d.name)}',${d.price})">ซื้อ ${d.price} 🪙</button>`
          : '<span class="muted">ล็อก · ได้จากกาชา</span>';
      return `<div class="dtile rar-${d.rarity} ${sel ? "worn" : ""} ${d.owned ? "" : "locked"}">
        <div class="dprev">${prev}</div><b>${d.slot === "title" ? esc(d.emoji) + " " : ""}${esc(d.name)}</b><span class="rar">${d.id === null ? "" : d.rarity}</span>${stBadge(d)}${act}</div>`;
    };
    const slotBtn = ([k, ic, lb]) => { const it = DRAFT[k]; const ch = changed.includes(k);
      return `<button class="slotbtn ${k === decSlot ? "on" : ""} ${ch ? "chg" : ""}" onclick="decSlot='${k}';render()">
        <span class="si">${it ? (it.image ? `<img src="${esc(it.image)}" alt="">` : k === "outfit" ? `<img src="assets/chars/${esc(s.char_class || "novice")}_${esc(it.key)}.png" alt="" onerror="this.replaceWith(document.createTextNode('${esc(it.emoji)}'))">` : esc(it.emoji)) : ic}</span><span class="sl">${lb}</span><small>${it ? esc(it.name) : k === "outfit" ? "ชุดเริ่มต้น" : "— ว่าง —"}</small></button>`; };
    return `<div class="card"><h3>ตัวละครของฉัน</h3>
      <div class="charrow"><div class="stagecol">${stage(s.char_class, ri, prevDc, "lg")}${titleTag(DRAFT)}
        <div class="row" style="justify-content:center;gap:6px;margin-top:8px"><span class="muted">เพศ</span>
        ${[["m", "👦 ชาย"], ["f", "👧 หญิง"]].map(([g, l]) => `<button class="btn small ${gOf(s.char_class, eq) === g ? "gold" : "ghost"}" onclick="setGender('${g}')">${l}</button>`).join("")}</div>
        ${altGender(s.char_class, eq.gender) && DRAFT.outfit ? '<p class="muted" style="font-size:12px">* ชุดนี้ยังไม่มีภาพของเพศที่เลือก จึงแสดงตัวพื้นฐานแทนไปก่อน</p>' : ""}</div>
        <div class="radarcol"><div class="muted center" style="margin-bottom:2px">📊 สเตตัสประกอบ${changed.length ? " (ตัวอย่างตามที่เลือก)" : ""}</div>${radarHtml(DRAFT)}</div></div>
      <div class="slotbar">${SLOTS.map(slotBtn).join("")}</div>
      <div class="savebar ${changed.length ? "on" : ""}"><span>${changed.length ? `✏️ เปลี่ยน ${changed.length} ช่อง ยังไม่ได้บันทึก` : "เลือกไอเทมด้านล่างเพื่อลองใส่ แล้วกดบันทึก"}</span>
        <span><button class="btn ghost small" ${changed.length ? "" : "disabled"} onclick="resetDraft()">↩︎ ยกเลิก</button>
        <button class="btn gold" ${changed.length ? "" : "disabled"} onclick="saveDraft()">💾 บันทึก</button></span></div>
      <p class="muted center" style="margin:6px 0 0">สะสมแล้ว ${owned}/${cat.length} ชิ้น · เหรียญ <span class="coin">🪙 ${s.coins}</span> · ได้ไอเทมจาก <a href="#" onclick="go('gacha');return false" style="color:var(--gold2)">กาชา</a> หรือซื้อด้านล่าง</p></div>
      <div class="card"><h3>${(SLOTS.find((x) => x[0] === decSlot) || [])[1]} ${(SLOTS.find((x) => x[0] === decSlot) || [])[2]}</h3><div class="dgrid">${items.map(tile).join("") || '<p class="muted">ยังไม่มีไอเทมในหมวดนี้</p>'}</div></div>
      ${statsHtml()}`;
  },

  shop() {
    return `<div class="card"><h3>🛒 ร้านสิทธิพิเศษ</h3><p class="muted">เหรียญของคุณ <span class="coin">🪙 ${D.student.coins}</span></p>
      ${D.shop.map((p) => `<div class="item"><span style="font-size:26px">${esc(p.emoji)}</span><div class="grow"><b>${esc(p.name)}</b>
        <div class="muted">${esc(p.description || "")}</div></div>
        <button class="btn small gold" ${D.student.coins < p.cost ? "disabled" : ""} onclick="buy('${p.id}')">${p.cost} 🪙</button></div>`).join("") || '<p class="muted">ยังไม่มีสินค้า</p>'}</div>`;
  },

  rank() {
    const me = D.rank_info;
    return `${hallHtml() || '<div class="card hof center"><h3>🏆 หอเกียรติยศ</h3><p class="muted">ยังไม่มีอันดับ — สะสม EXP จากเช็คชื่อ ส่งงาน เควส และมินิเกมเพื่อขึ้นโพเดียม</p></div>'}
    <div class="card"><h3>🏆 อันดับห้อง ${esc(D.class.name)} (Top 10)</h3>
      <div class="lb">${D.leaderboard.map((l, i) => `<div class="lbrow ${l.me ? "me" : ""}">
        <span class="lbn n${i + 1}">${i + 1}</span>${frame(l.avatar, l.char_class, l.rank_info, 0, true, l.decor)}
        <div class="lbm"><b class="lbname">${esc(l.name)}</b>${titleTag(l.decor)}<small class="rk-${l.rank_info.key}" style="color:var(--rc)">${esc(rankName(l.rank_info))}${clsOf(l.char_class) ? " · " + esc(clsOf(l.char_class).name) : ""}</small></div>
        <div class="lbr"><span class="pill">Lv.${l.level}</span><b>${l.exp}</b><small class="muted">EXP</small></div></div>`).join("")}</div></div>
      ${teamsHtml()}
      <div class="card"><h3>🎖️ บันไดแรงค์</h3><p class="muted">ได้ EXP จากเช็คชื่อ ส่งงาน เควส และ Achievement เพื่อไต่แรงค์ (แต่ละแรงค์มีดิวิชัน IV → I)</p>
      <div class="ranktable">${(D.ranks || []).map((r) => `<div class="rk-${r.key} ${r.key === me.key ? "me" : ""}"><img src="${esc(r.image)}" alt=""><br><b style="color:var(--rc)">${esc(r.name)}</b><br><span class="muted">${r.min_exp}+ EXP</span></div>`).join("")}</div></div>`;
  },
};

/* ---------------- การกระทำ ---------------- */
async function act(fn, okMsg) {
  try { const r = await fn(); await load(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message); }
}
const claim = (id) => act(() => rpc("claim_quest", { p_token: tk(), p_quest: id }), "ส่งเควสแล้ว รอครูตรวจ ✅");
const buy = (id) => confirm("ยืนยันการแลกสิทธิพิเศษ?") && act(() => rpc("buy_privilege", { p_token: tk(), p_privilege: id }), "แลกสำเร็จ 🎉 ดูได้ในหน้า “คลัง”");
const usePriv = (id) => confirm("ขอใช้สิทธิ์นี้ ครูจะเป็นผู้อนุมัติ")
  && act(() => rpc("request_privilege", { p_token: tk(), p_redemption: id }), "ส่งคำขอให้ครูแล้ว");
const pickClass = (k, n) => confirm("เลือกคลาส “" + n + "” ?") && act(() => rpc("choose_class", { p_token: tk(), p_key: k }), "เปลี่ยนคลาสแล้ว ⚔️");
const buyDecor = (id, n, p) => confirm(`ซื้อ “${n}” ราคา ${p} เหรียญ?`) && act(() => rpc("buy_decor", { p_token: tk(), p_item: id }), "ซื้อสำเร็จ 🎉 กด “สวมใส่” ได้เลย").then(() => FX.coins(".coin", 4));
const pickDecor = (slot, id) => { const it = id ? (D.decor_catalog || []).find((d) => d.id === id) : null; if (it) DRAFT[slot] = it; else delete DRAFT[slot]; render(); if (it) FX.at(".stg", "spirit-flame", { scale: 1.6, foot: true }); };
const resetDraft = () => { DRAFT = null; render(); };
const saveDraft = () => act(async () => {
  const eq = D.student.decor || {};
  for (const [k] of SLOTS) { const cur = eq[k] ? eq[k].id : null, nxt = DRAFT[k] ? DRAFT[k].id : null; if (cur !== nxt) await rpc("equip_decor", { p_token: tk(), p_slot: k, p_item: nxt }); }
}, "บันทึกการแต่งตัวแล้ว ✨").then(() => setTimeout(() => FX.at(".stg", "mana-burst", { scale: 2.2 }), 300));
const setGender = (g) => act(() => rpc("set_gender", { p_token: tk(), p_gender: g }), "เปลี่ยนเพศตัวละครแล้ว ✨");
const equipDecor = (slot, id) => act(() => rpc("equip_decor", { p_token: tk(), p_slot: slot, p_item: id }), id ? "สวมใส่แล้ว ✨" : "ถอดออกแล้ว");
const claimBoss = () => act(() => rpc("boss_claim", { p_token: tk() }), "รับรางวัลปราบบอสแล้ว 🎉").then((r) => { FX.victory(); return r; });
const submitOnline = (id, t) => confirm(`ส่งงาน “${t}” ?`) && act(async () => { const r = await rpc("submit_assignment", { p_token: tk(), p_assignment: id }); toast(`ส่งแล้ว ✅ ได้ +${r.exp} EXP ทันที`, 3500); return r; });
async function shrink(file, max = 1280, q = 0.72) {
  let bmp; try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) { bmp = await createImageBitmap(file); }
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
  c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob(res, "image/jpeg", q));
}
async function submitPhoto(id, input) {
  const f = input.files && input.files[0]; if (!f) return;
  toast("กำลังอัปโหลดรูป…", 12000);
  try {
    const blob = await shrink(f); if (!blob) throw new Error("อ่านรูปไม่สำเร็จ");
    if (blob.size > 1500000) throw new Error("รูปใหญ่เกินไป ลองถ่ายใหม่");
    const slot = await rpc("begin_upload", { p_token: tk(), p_assignment: id });
    const up = await sb.storage.from("submissions").upload(slot + ".jpg", blob, { contentType: "image/jpeg", upsert: false });
    if (up.error) throw new Error("อัปโหลดไม่สำเร็จ: " + up.error.message);
    const r = await rpc("submit_assignment", { p_token: tk(), p_assignment: id, p_slot: slot });
    await load(); toast(`ส่งงานแล้ว ✅ ได้ +${r.exp} EXP ทันที`, 3500);
  } catch (e) { toast(e.message); }
  input.value = "";
}

/* ---------------- รูปโปรไฟล์ของนักเรียน: เลือกรูป → ซูม/เลื่อนครอป → บันทึก (เก็บ JPEG 160px เล็กๆ) ---------------- */
const CR = { img: null, z: 1, x: 0, y: 0, base: 1, drag: null }, CRV = 260;
function photoOpen(input) {
  const f = input.files && input.files[0]; input.value = ""; if (!f) return;
  if (!/^image\//.test(f.type)) return toast("เลือกไฟล์รูปภาพเท่านั้น");
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => { CR.img = im; CR.base = CRV / Math.min(im.width, im.height); CR.z = 1; CR.x = CR.y = 0; URL.revokeObjectURL(url); cropShow(); };
  im.onerror = () => toast("อ่านรูปไม่สำเร็จ"); im.src = url;
}
function cropClamp() {
  const s = CR.base * CR.z, mx = Math.max(0, (CR.img.width * s - CRV) / 2), my = Math.max(0, (CR.img.height * s - CRV) / 2);
  CR.x = Math.max(-mx, Math.min(mx, CR.x)); CR.y = Math.max(-my, Math.min(my, CR.y));
}
function cropDraw(cv, size) {
  const k = size / CRV, s = CR.base * CR.z * k, w = CR.img.width * s, h = CR.img.height * s, c = cv.getContext("2d");
  c.fillStyle = "#fff"; c.fillRect(0, 0, size, size); c.imageSmoothingQuality = "high";
  c.drawImage(CR.img, size / 2 - w / 2 + CR.x * k, size / 2 - h / 2 + CR.y * k, w, h);
}
function cropShow() {
  let ov = document.getElementById("cropov"); if (!ov) { ov = document.createElement("div"); ov.id = "cropov"; ov.className = "overlay"; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="card cropbox"><h3 style="margin:0 0 6px">📷 ปรับรูปโปรไฟล์</h3><p class="muted" style="margin:0 0 8px">ลากเพื่อเลื่อนรูป · เลื่อนแถบหรือหมุนเมาส์เพื่อซูม</p>
    <div class="crwrap"><canvas id="crcv" width="${CRV}" height="${CRV}"></canvas><div class="crmask"></div></div>
    <div class="row" style="justify-content:center;margin:10px 0"><span>🔍−</span><input type="range" id="crz" min="1" max="4" step="0.01" value="1" style="width:180px"><span>+</span></div>
    <div class="row" style="justify-content:center"><button class="btn gold" onclick="cropSave()">💾 บันทึกรูปนี้</button><button class="btn ghost" onclick="cropClose()">ยกเลิก</button></div></div>`;
  ov.classList.add("on");
  const cv = document.getElementById("crcv"), redraw = () => { cropClamp(); cropDraw(cv, CRV); };
  redraw();
  document.getElementById("crz").oninput = (e) => { CR.z = Number(e.target.value); redraw(); };
  cv.addEventListener("wheel", (e) => { e.preventDefault(); CR.z = Math.max(1, Math.min(4, CR.z * (e.deltaY < 0 ? 1.08 : 0.93))); document.getElementById("crz").value = CR.z; redraw(); }, { passive: false });
  cv.onpointerdown = (e) => { CR.drag = [e.clientX, e.clientY, CR.x, CR.y]; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = (e) => { if (!CR.drag) return; CR.x = CR.drag[2] + e.clientX - CR.drag[0]; CR.y = CR.drag[3] + e.clientY - CR.drag[1]; redraw(); };
  cv.onpointerup = cv.onpointercancel = () => { CR.drag = null; };
}
const cropClose = () => { document.getElementById("cropov")?.classList.remove("on"); CR.img = null; };
async function cropSave() {
  try {
    const out = document.createElement("canvas"); out.width = out.height = 160; cropDraw(out, 160);
    let q = 0.85, data = out.toDataURL("image/jpeg", q);
    while (data.length > 26000 && q > 0.35) { q -= 0.1; data = out.toDataURL("image/jpeg", q); }
    if (data.length > 29000) throw new Error("รูปใหญ่เกินไป ลองรูปอื่น");
    await rpc("set_photo", { p_token: tk(), p_data: data });
    cropClose(); await load(); toast("เปลี่ยนรูปโปรไฟล์แล้ว ✨");
  } catch (e) { toast(e.message); }
}
const photoReset = () => act(() => rpc("set_photo", { p_token: tk(), p_data: null }), "กลับไปใช้รูปเดิมแล้ว");
const setAv = (id) => act(() => rpc("set_avatar", { p_token: tk(), p_item: id }), "เปลี่ยนอวาตาร์แล้ว");

async function pull(n) {
  try {
    const r = await rpc("gacha_pull", { p_token: tk(), p_n: n });
    const ov = $("#overlay");
    ov.innerHTML = `<h2>✨ ผลการสุ่ม</h2><div id="cards">${r.items.map((it, i) => `
      <div class="gcard rar-${it.rarity}" id="gc${i}"><div class="in"><div class="b"></div>
      <div class="f"><div><div class="e">${itemImg(it.image, it.emoji, "gi")}</div><div class="rar">${it.rarity}</div><div class="n">${esc(it.name)}</div>${it.kind === "decor" ? `<div class="n muted">${it.dup_refund ? "ซ้ำ! คืน +" + it.dup_refund + "🪙" : "🎨 ไอเทมตกแต่งใหม่!"}</div>` : ""}</div></div></div></div>`).join("")}</div>
      <p><button class="btn gold" onclick="closeOv()">รับของ</button></p>`;
    ov.classList.add("on");
    r.items.forEach((it, i) => { setTimeout(() => $("#gc" + i)?.classList.add("flip"), 350 + i * 330); setTimeout(() => FX.gacha("#gc" + i, it.rarity), 600 + i * 330); });
    await load();
  } catch (e) { toast(e.message); }
}
function closeOv() { $("#overlay").classList.remove("on"); }

load();
</script>

<canvas id="fx"></canvas>
<script>
/* เอฟเฟกต์แสง: ประกายลอย + แสงตามเมาส์บนการ์ด */
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var c=document.getElementById("fx"),x=c.getContext("2d"),P=[],W,H;
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight}
  rs();addEventListener("resize",rs);
  var n=innerWidth<600?28:55,cols=["#ffd75a","#b48cff","#7fe9ff","#ffffff"];
  for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,
    v:Math.random()*.35+.08,t:Math.random()*6.28,c:cols[i%4]});
  (function f(){x.clearRect(0,0,W,H);
    P.forEach(function(p){p.y-=p.v;p.t+=.03;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      x.globalAlpha=.25+.55*Math.abs(Math.sin(p.t));x.fillStyle=p.c;x.shadowColor=p.c;x.shadowBlur=8;
      x.beginPath();x.arc(p.x+Math.sin(p.t)*6,p.y,p.r,0,6.28);x.fill()});
    requestAnimationFrame(f)})();
  document.addEventListener("pointermove",function(e){
    var el=e.target.closest&&e.target.closest(".card");if(!el)return;
    var b=el.getBoundingClientRect();
    el.style.setProperty("--mx",(e.clientX-b.left)+"px");el.style.setProperty("--my",(e.clientY-b.top)+"px")});
})();
</script>
</body>
